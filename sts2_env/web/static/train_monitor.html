:root{--yel:#e2a400;--yel-bg:#fff6d6;--yel-ink:#7a5a00}
.chg-modified.side-before,.chg-modified.side-after{outline:2px solid var(--yel);outline-offset:2px;background-color:var(--yel-bg)!important}
.chg-modified.side-before{outline-style:dashed}
.chg-tag-modified,.chg-tag-modified.side-before,.chg-tag-modified.side-after{background:var(--yel);color:#2f2400}
.chip.c-modified{background:var(--yel-bg);color:var(--yel-ink)}
.dot-modified{background:var(--yel)}
.c-mod{color:var(--yel-ink)}
.lg.mod{outline:2px solid var(--yel);background:var(--yel-bg)}
.legend.sm{margin-top:4px;gap:10px}
/* marks on wireframes */
.mk-added{outline:2px solid var(--green);background-color:var(--green-bg)!important}
.mk-removed{outline:2px solid var(--red);background-color:var(--red-bg)!important}
.mk-modified{outline:2px solid var(--yel);background-color:var(--yel-bg)!important}
.mk-u{outline-width:3px!important;outline-offset:4px}
.cv-frame.mk-u{outline-offset:6px}
.mk-inner{outline-width:2px;outline-offset:1px}
.mk-inner.mk-added{outline-style:solid}.mk-inner.mk-removed{outline-style:dashed}
.mk-d{outline-offset:2px}
.mk-d.mk-modified.side-before{outline-style:dashed}
.wf.t-button.v-primary.mk{color:var(--ink);background-color:#fff}
.wf.t-button.v-primary.mk .wf-fn{background:#f5f2fb;color:#5b4b8a}
.mk-removed.mk-u>.wf-children,.mk-removed.mk-u>.wf-cap,.mk-removed.mk-u>.wf-lbl,.mk-removed.mk-u>.wf-text{opacity:.75}
.u-num{position:absolute;top:-15px;left:-15px;z-index:6;min-width:26px;height:26px;padding:0 6px;border-radius:13px;color:#fff;font-weight:700;font-size:14px;line-height:26px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.25);pointer-events:none}
.u-tag{position:absolute;top:-11px;left:16px;z-index:5;font-size:11px;line-height:17px;padding:0 6px;border-radius:4px;color:#fff;font-weight:600;pointer-events:none;white-space:nowrap}
.u-added{background:var(--green)}.u-removed{background:var(--red)}.u-modified{background:var(--yel);color:#2f2400}
.u-dot{flex:none;display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 5px;border-radius:11px;color:#fff;font-weight:700;font-size:12px}
.u-sel{box-shadow:0 0 0 6px rgba(62,99,221,.35)!important}
.wf-comp{display:none;position:absolute;top:-9px;right:8px;z-index:3;font:10px/15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#4a4f57;background:#eef0f3;border:1px solid #dcdfe5;border-radius:3px;padding:0 4px;pointer-events:none;max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.show-comp .wf-comp,.dt-render .wf-comp{display:block}
.cv-vp:not(.show-fn) .wf-fn{display:none}
.wf-same{font-size:11px;color:var(--faint);margin-top:2px}
.fade .wf.is-leaf:not(.in-chg):not(.mk),.fade .wf.is-c:not(.in-chg):not(.mk)>.wf-cap,.fade .wf:not(.in-chg)>.wf-same{opacity:.35}
/* layout */
.main.main-canvas{padding:0;overflow:hidden;display:flex}
.cv-layout{display:flex;flex:1;min-width:0;min-height:0}
.cv-list{width:290px;flex:none;border-right:1px solid var(--line2);background:#fff;overflow:auto;padding:12px 12px 40px}
.cv-sum summary{cursor:pointer;font-weight:600;margin-bottom:4px}
.cv-sum .summary{font-size:12px;margin:0 0 8px}
.cv-page{display:flex;gap:6px;align-items:center;flex-wrap:wrap;width:100%;text-align:left;border:none;background:none;padding:8px 6px 4px;white-space:normal}
.cv-page:hover{background:none;color:var(--blue)}
.cv-item{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;white-space:normal;border:1px solid transparent;background:none;border-radius:8px;padding:6px 8px;margin-bottom:2px}
.cv-item:hover{background:#f5f6f8}
.cv-item.on{border-color:#b9c6f3;background:var(--blue-bg)}
.cv-item-b{display:flex;flex-direction:column;gap:2px;min-width:0}
.cv-item-t{font-weight:550}
.cv-item-n{font-size:11.5px;color:var(--muted)}
.cv-q{margin-top:14px;width:100%;white-space:normal;text-align:left;background:var(--amber-bg);border-color:#efd28f;color:#6f520f}
.cv-vp{flex:1;min-width:0;position:relative;overflow:hidden;background-color:#e9ebef;background-image:radial-gradient(#c9cdd5 1px,transparent 1px);background-size:22px 22px;cursor:grab;user-select:none}
.cv-vp.panning,.cv-vp.space{cursor:grabbing}
.cv-vp.editing{cursor:default}.cv-vp.editing.space{cursor:grab}
.cv-world{position:absolute;left:0;top:0;transform-origin:0 0;display:flex;flex-wrap:wrap;width:max-content;max-width:3600px;gap:140px;align-items:flex-start;padding:30px}
.cv-world.anim{transition:transform .35s ease}
.cv-group{display:flex;gap:48px;align-items:flex-start}
.cv-frame{position:relative;flex:none;background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(20,24,32,.10)}
.cv-fh{display:flex;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line2);font-size:15px;font-weight:650;cursor:pointer;position:relative;background:#fbfbfc;border-radius:12px 12px 0 0}
.cv-fb{padding:18px 16px 16px}
.cv-ovcol{display:flex;flex-direction:column;gap:28px;flex:none}
.cv-ov{background:#fff;border-radius:10px;box-shadow:0 2px 10px rgba(20,24,32,.10);padding:12px}
.cv-ovh{font-size:12px;color:var(--purple);margin-bottom:12px;display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.cv-ovdrop{width:320px;border:2px dashed #b9c0cc;border-radius:10px;padding:18px;color:var(--muted);font-size:13px;text-align:center;background:rgba(255,255,255,.6)}
.cv-tools{position:absolute;top:10px;right:10px;z-index:20;display:flex;gap:4px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:9px;padding:4px;box-shadow:0 2px 8px rgba(0,0,0,.08);cursor:default}
.cv-tools button{padding:2px 9px;border-color:transparent}
.cv-tools button.on{background:var(--ink);color:#fff}
.cv-zoom{min-width:44px;text-align:center;font-size:12px;color:var(--muted)}
.cv-sep{width:1px;height:18px;background:var(--line2);margin:0 2px}
.cv-hint{position:absolute;left:12px;bottom:10px;z-index:20;font-size:11.5px;color:var(--muted);background:rgba(255,255,255,.85);padding:2px 8px;border-radius:6px}
.cv-vp .palette{position:absolute;left:10px;right:10px;bottom:38px;top:auto;z-index:20;margin:0;cursor:default;box-shadow:0 2px 10px rgba(0,0,0,.12);flex-wrap:nowrap;overflow-x:auto;padding:6px 10px}
.cv-vp .palette .pal-g{flex-wrap:nowrap}
/* detail panel */
.inspector.dt{width:min(560px,44vw)}
.dt-nav{display:inline-flex;gap:4px;margin-left:auto;margin-right:8px}
.dt-nav button{padding:1px 8px;font-size:12px}
.dt-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:15px}
.dt-unit{display:flex;flex-direction:column;gap:10px}
.dt-cmp{display:flex;flex-direction:column;gap:12px}
.dt-render{border:1px solid var(--line2);border-radius:8px;padding:16px 12px 12px;background:#fafbfc;overflow:auto;max-height:520px}
.dt-render .wf-fn{display:inline-block}
.dt-void{border:1px dashed var(--line);border-radius:8px;padding:18px;text-align:center;color:var(--faint);background:repeating-linear-gradient(45deg,#fafafa,#fafafa 8px,#f3f3f3 8px,#f3f3f3 16px)}
.dt-block{border-top:1px solid var(--line2);padding-top:8px}
.dt-list{margin:0;padding-left:18px;font-size:12.5px}.dt-list li{padding:2px 0}
.dt-list.fns{list-style:none;padding-left:0}
.dt-sec{border-top:2px solid var(--line2);padding-top:10px;display:flex;flex-direction:column;gap:10px}
.wf-stat.sm{font-size:14px}
.cv-vp .palette .pal-item,.cv-vp .palette .pal-gt{white-space:nowrap;flex:none}
.cv-vp .palette .pal-g{flex:none}

/* ================= hard prototype theme: square corners, flat surfaces, no shadows, black lines ================= */
:root{--ink:#111;--muted:#555;--faint:#8a8a8a;--line:#b5b5b5;--line2:#d4d4d4;--bg:#f0f0f0;--wf:#fff;--wf-line:#333;--blue:#1f4fd8;--blue-bg:#eaf0ff;--purple:#5b34a6}
*,*::before,*::after{border-radius:0!important}
body{background:var(--bg)}
.card,.stat,.frame,.cv-frame,.cv-ov,.cv-tools,.palette,.cv-vp .palette,.modal-box,.toast,.u-num,.wf.t-modal,.wf.t-drawer,.wf.t-popover,.wf.t-menu{box-shadow:none}
/* app chrome */
.top{border-bottom:1px solid var(--ink)}
.tabs{border-bottom:1px solid var(--ink)}
.tabs button.on{border-bottom-width:3px}
button{border:1px solid var(--ink);background:#fff;padding:3px 10px}
button:hover:not(:disabled){background:#e8e8e8}
.seg{border:1px solid var(--ink)}
.stage{border:1px solid currentColor}
.card{border:1px solid var(--ink)}
.inspector{border-left:1px solid var(--ink)}
.cv-list{border-right:1px solid var(--ink)}
input,select,textarea{border:1px solid #777}
.banner{border-bottom:1px solid var(--ink)}
.cv-item{border:1px solid transparent}
.cv-item.on{border-color:var(--ink);background:#fff}
.cv-q{border:1px solid var(--ink);background:#fff;color:var(--ink)}
.chip{border:1px solid currentColor;background:#fff}
.u-dot{border:1px solid rgba(0,0,0,.25)}
/* canvas */
.cv-vp{background-color:#ececec;background-image:linear-gradient(#dcdcdc 1px,transparent 1px),linear-gradient(90deg,#dcdcdc 1px,transparent 1px);background-size:24px 24px}
.cv-frame{border:1.5px solid var(--ink)}
.cv-fh{background:#fff;border-bottom:1px solid var(--ink);font-size:14px;font-weight:700}
.cv-fb{padding:16px}
.cv-ov{border:1.5px solid var(--ink);padding:10px}
.cv-ovdrop{border:1.5px dashed #666;background:#fff}
.cv-tools{border:1px solid var(--ink)}
.cv-tools button{border:none}
.cv-vp .palette{border:1px solid var(--ink)}
.cv-hint{background:#fff;border:1px solid var(--line)}
.u-num{top:-14px;left:-14px;min-width:24px;height:24px;line-height:24px;font-size:13px}
.u-tag{top:-10px;left:12px}
.u-sel{box-shadow:0 0 0 4px var(--blue)!important}
/* wireframes */
.wf{border:1px solid #333;background:#fff;padding:7px 9px}
.wf:hover{border-color:#000}
.wf.is-c{border-color:#888}
.wf-cap{font-weight:700;color:#111}
.wf-text{color:#222}
.wf.t-button{border:1.5px solid #111;background:#fff}
.wf.t-button.v-primary{background:#111;border-color:#111;color:#fff}
.wf.t-button.v-danger{border-color:#111}
.wf.t-badge,.wf.t-tag{border:1px solid #111;background:#fff}
.wf-field{border:1px solid #444;color:#999}
.wf-it{border:1px solid #999;background:#fff}
.wf-table{border:1px solid #444}
.wf-table .th{background:#ececec;border-bottom:1px solid #444;border-right:1px solid #ccc}
.wf-table .td{border-right:1px solid #eee}
.wf-table .td::after,.wf-bars i{background:#dcdcdc}
.wf-media{background-color:#fff;border:1px solid #444;background-image:linear-gradient(to top right,transparent calc(50% - .6px),#aaa 50%,transparent calc(50% + .6px)),linear-gradient(to bottom right,transparent calc(50% - .6px),#aaa 50%,transparent calc(50% + .6px))}
.wf-media span{background:#fff;padding:0 4px}
.wf.t-placeholder{background:#fff;border:1px dashed #777}
.wf-toggle{border:1px solid #333;background:#fff}
.wf.t-modal,.wf.t-drawer,.wf.t-popover,.wf.t-menu{border:2px solid #111}
.wf-fn{background:#fff;border:1px solid #c7bce3}
.wf-note{background:#fff;border-left:3px solid var(--yel);color:#4d3c00}
.wf-comp{background:#fff;border:1px solid #888}
.wf-empty{border:1px dashed #888}
.frame{border:1px solid #444}
.frame.void,.dt-void{background:#fff;border:1px dashed #888}
.dt-render{background:#fff;border:1px solid #888}
.ins-note{border-left:3px solid var(--yel);background:#fffdf3}
.diff{border:1px solid #888}
/* flows & backend */
.lane-h{border-bottom:2px solid #111;color:#111}
.lane-bg{background:#f6f6f6;border-left:1px solid #ddd;border-right:1px solid #ddd}
.step{border:1px solid #333;background:#fff}
.step.k-decision{border-style:dashed}
.step-n{background:#fff;border:1px solid #333;color:#111}
.mod{border:1px solid #333}
.be-item{border:1px solid #bbb}
.wf-media.chart{background-image:none}

/* narrow windows (e.g. DSH sidebar preview): canvas keeps the full width */
.cv-listbtn{display:none}
.cv-tools{flex-wrap:wrap;max-width:calc(100% - 20px)}
@media (max-width:1100px){
  .cv-layout{position:relative}
  .cv-listbtn{display:inline-block}
  .cv-list{display:none;position:absolute;left:0;top:0;bottom:0;z-index:40;width:min(300px,88%);border-right:1px solid var(--ink)}
  .cv-layout.list-open .cv-list{display:block}
  .inspector.dt{position:absolute;right:0;top:0;bottom:0;z-index:35;width:min(520px,92%);border-left:1px solid var(--ink)}

}

/* pointer drag */
.cv-vp{touch-action:none}
.cv-vp.editing [data-drag]{cursor:move}
.is-dragging,.is-dragging *{cursor:grabbing!important}
.drag-ghost{position:fixed;z-index:999;pointer-events:none;background:#111;color:#fff;padding:2px 8px;font-size:12px;white-space:nowrap}
.drag-ghost.no{background:#888}
.pal-item{touch-action:none}

/* trigger → overlay connectors */
.cv-links{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;z-index:4}
.cv-link{fill:none;stroke-width:2.5;opacity:.85}
.cv-link.dashed{stroke-dasharray:8 6}
.cv-link.on{stroke-width:4;opacity:1}
.trig-list{display:flex;flex-direction:column;gap:3px;max-height:180px;overflow:auto;border:1px solid var(--line);padding:4px 6px;color:var(--ink)}
.trig-opt{display:flex;align-items:center;gap:4px;font-size:12px}

/* ---------------- interactions & play (prototype) mode ---------------- */
.is-trigger>.wf-lbl::after{content:none}
.wf.is-trigger::after{content:"▸";position:absolute;top:0;right:3px;color:var(--purple);font-weight:700;font-size:11px;line-height:14px;pointer-events:none}
.wf-cond{border-style:dashed!important;border-color:var(--purple)!important}
.cond-tag,.st-tag{position:absolute;bottom:-9px;z-index:3;font-size:10px;line-height:15px;padding:0 5px;background:#fff;border:1px solid var(--purple);color:var(--purple);pointer-events:none;white-space:nowrap}
.cond-tag{right:8px}.st-tag{left:8px}
.cv-link-lab{font-size:13px;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:5px;text-anchor:middle;dominant-baseline:middle}
.cv-link:not(.on){opacity:.55}
.play-btn{border-color:var(--purple);color:var(--purple);font-weight:700}
.play-btn:hover:not(:disabled){background:#f3effb}
.play-btn.on{background:var(--purple);color:#fff}
.body.pl{display:flex}
.pl-side{width:290px;flex:none;border-right:1px solid var(--ink);background:#fff;overflow:auto;padding:12px 12px 40px;display:flex;flex-direction:column;gap:6px}
.pl-side .sec-t{margin-top:8px}
.pl-ia{padding-left:16px}.pl-ia li{margin-bottom:5px}.pl-ia .lnk{font-weight:600;text-align:left;white-space:normal}
.pl-main{flex:1;min-width:0;display:flex;flex-direction:column}
.pl-bar{display:flex;gap:8px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--ink);background:#fff;flex-wrap:wrap}
.pl-stage{flex:1;overflow:auto;background:#3a3a3a;padding:24px}
.pl-wrap{margin:0 auto;position:relative}
.pl-frame{position:relative;background:#fff;border:1.5px solid #111;transform-origin:0 0}
.pl-fh{display:flex;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid #111;font-size:14px;font-weight:700}
.pl-fb{padding:16px}
.pl-frame .wf{cursor:default}
.pl-frame [data-ia]{cursor:pointer}
.pl-frame [data-ia]:hover{outline:2px solid rgba(31,79,216,.55);outline-offset:1px}
.pl-frame.pl-hint [data-ia]{outline:2px solid #1f4fd8!important;outline-offset:1px;background-color:rgba(31,79,216,.14)!important}
.pl-back{position:absolute;inset:0;z-index:30}
.pl-back.dim{background:rgba(0,0,0,.4)}
.pl-back-modal{display:flex;justify-content:center;align-items:flex-start}
.pl-back-modal .pl-ov{position:sticky;top:40px;margin-top:70px}
.pl-back-drawer{display:flex;justify-content:flex-end}
.pl-back-drawer .pl-ov{min-height:100%;border-width:0 0 0 2px}
.pl-back-menu .pl-ov,.pl-back-popover .pl-ov{position:absolute}
.pl-ov{background:#fff;border:2px solid #111;padding:10px;max-width:92%}
.pl-void{padding:80px;text-align:center;color:var(--faint);border:1px dashed #888}
.pl-frame .wf-fn,.pl-frame .wf-same,.pl-frame .cmt-badge{display:none}

/* side panels for click-revealed content */
.cv-ovcol{gap:0}
.cv-ovcol.left.empty{display:none}
.wf.wf-slot{border:1.5px dashed var(--purple);background:#faf8ff;color:var(--purple);font-size:12px;padding:6px 9px;cursor:pointer}
.cv-rev{border-style:dashed}
.cv-rev>.cv-ovh{color:var(--purple)}
.pl-side>*{flex:none}

/* ==== workbench shell ==== */
/* smyw review workbench: shell.
 *
 * Three-column application frame borrowed in spirit from shadcn sidebar-15
 * ("A left and right sidebar"): a collapsible rail, an inset centre column with a
 * compact header, and a collapsible right inspector. Canvas control placement and
 * the quiet selected state follow React Flow's dark-mode example.
 *
 * Palette is neutral graphite with a single soft blue accent. Teal belongs to the
 * aurora only; it does not tint text, code or chrome.
 */

:root{
  color-scheme:dark;

  --shell:#101216;
  --rail:#14171C;
  --surface:#1B2027;
  --surface-2:#20262E;
  --overlay:#242A33;
  --overlay-2:#2B323C;

  --text:#E8ECF2;
  --text-2:#C3CAD4;
  --muted:#A0A9B6;
  --faint:#7C8695;

  --line:rgba(255,255,255,.08);
  --line-2:rgba(255,255,255,.05);
  --line-3:rgba(255,255,255,.14);

  --accent:#8DAEFF;
  --accent-soft:rgba(141,174,255,.14);
  --accent-line:rgba(141,174,255,.38);

  --add:#74C69D;
  --add-soft:rgba(116,198,157,.12);
  --del:#E58B94;
  --del-soft:rgba(229,139,148,.12);
  --mod:#D8B477;
  --mod-soft:rgba(216,180,119,.12);

  --focus:#8DAEFF;

  --fs-1:12px;
  --fs-2:12px;
  --fs-3:13px;
  --fs-4:14px;
  --fs-5:15px;
  --fs-6:18px;
  --fs-7:22px;

  --mono:ui-monospace,SFMono-Regular,"Cascadia Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;

  --r-1:4px; --r-2:6px; --r-3:8px; --r-4:12px;

  --rail-w:220px;
  --dt-w:280px;
  --top-h:48px;
}

/* The generator sets border-radius:0!important globally; radii are the one place a
   flag is still required. Everything else wins on specificity. */
*{border-radius:var(--r-1)}
.cv-frame,.card,.mod,.modal-box,.toast,.palette,.cv-tools,.dt-render,.dt-void,.frame,.stat,.cv-ov{border-radius:var(--r-4)!important}
.step,.be-item,.diff,.cmt,.wf,.wf-it,.wf-field,.route,.cmp-seg,.u-num,.chg-tag,.flow-fold,.pal-item,.q-opts button{border-radius:var(--r-2)!important}
.wf.t-button,.wf.t-badge,.wf.t-tag,.chip,.stage{border-radius:var(--r-3)!important}
.dot,.u-dot,.step-n,.lg{border-radius:50%!important}

html,body{background:var(--shell);height:100%}
body{
  font:var(--fs-4)/1.6 var(--sans);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow:hidden;
}
::selection{background:rgba(141,174,255,.26);color:#fff}
*{scrollbar-width:thin;scrollbar-color:#2C333D transparent}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:#2C333D;border:3px solid transparent;background-clip:content-box;border-radius:8px!important}
*::-webkit-scrollbar-thumb:hover{background:#3A424E;background-clip:content-box}
*::-webkit-scrollbar-track{background:transparent}
code,.mono{font-family:var(--mono);font-variant-ligatures:none}

/* ================================================================ app frame */
#app{
  display:grid;
  grid-template-rows:var(--top-h) auto 1fr;
  height:100vh;
  background:var(--shell);
}

/* ---------------------------------------------------------------- top bar */
.top{
  display:flex;align-items:center;gap:10px;
  padding:0 14px;
  background:var(--shell);
  border-bottom:1px solid var(--line);
  min-height:0;
}
.top h1{
  font-size:var(--fs-4);font-weight:600;letter-spacing:.005em;
  color:var(--text);
  max-width:min(38vw,460px);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  margin:0;
}
.top .ver{color:var(--faint);font-size:var(--fs-1);font-family:var(--mono)}
.top .stage{
  background:transparent;border:1px solid var(--line-3);
  color:var(--muted);font-size:var(--fs-1);
  padding:1px 8px;letter-spacing:.02em;font-weight:500;
}
.top .stage.st-done{color:var(--add);border-color:rgba(116,198,157,.34)}
.top .stage.st-implementing{color:var(--accent);border-color:var(--accent-line)}
.hdr-meta{
  font-size:var(--fs-1);color:var(--faint);
  font-variant-numeric:tabular-nums;letter-spacing:.01em;
}
.hdr-meta b{color:var(--text-2);font-weight:600}

/* Primary actions sit at the end; everything secondary folds into the menu. */
.acts-top{
  margin-left:auto;display:flex;gap:4px;align-items:center;
}
.top button{
  background:transparent;border:1px solid transparent;
  color:var(--muted);padding:5px 10px;font-size:var(--fs-2);
  transition:background .13s ease,color .13s ease,border-color .13s ease;
}
.top button:hover:not(:disabled){background:rgba(255,255,255,.06);color:var(--text)}
.top button:disabled{opacity:.34}
.top button.primary{
  background:var(--accent-soft);border-color:var(--accent-line);
  color:var(--accent);font-weight:600;
}
.top button.primary:hover:not(:disabled){background:rgba(141,174,255,.2)}
.top button.lnk{border-color:transparent;color:var(--faint)}
.top button.lnk:hover:not(:disabled){color:var(--muted)}
.top button.lnk.danger{color:var(--del)}
.cnt{
  background:rgba(141,174,255,.2);color:#BFD1FF;
  font-size:10px;line-height:15px;min-width:15px;padding:0 5px;margin-left:5px;
}

/* mode switch: a quiet segmented control, not two competing buttons */
.top .seg{
  display:inline-flex;border:1px solid var(--line);background:rgba(255,255,255,.02);
  overflow:hidden;gap:0;
}
.top .seg button{border:none;color:var(--muted);padding:4px 11px;font-size:var(--fs-2)}
.top .seg button.on{background:rgba(255,255,255,.09);color:var(--text);font-weight:600}

/* overflow menu */
.hdr-more{position:relative}
.hdr-more>button{border-color:var(--line);color:var(--muted)}
.hdr-menu{
  position:absolute;right:0;top:calc(100% + 6px);z-index:60;
  min-width:190px;padding:5px;
  background:var(--overlay);border:1px solid var(--line-3);
  border-radius:var(--r-3)!important;
  box-shadow:0 16px 40px -14px rgba(0,0,0,.9);
  display:flex;flex-direction:column;
}
.hdr-menu button{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  width:100%;text-align:left;border:none;color:var(--text-2);
  padding:7px 9px;font-size:var(--fs-2);
}
.hdr-menu button:hover:not(:disabled){background:rgba(255,255,255,.06);color:var(--text)}
.hdr-menu .k{font-size:var(--fs-1);color:var(--faint);font-family:var(--mono)}
.hdr-menu .sep{height:1px;background:var(--line);margin:4px 2px}

/* ---------------------------------------------------------------- view tabs */
.tabs{
  display:flex;align-items:center;gap:2px;
  padding:0 12px;
  background:var(--shell);
  border-bottom:1px solid var(--line);
  overflow-x:auto;scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tabs button{
  color:var(--muted);font-size:var(--fs-3);font-weight:500;
  padding:9px 11px;margin-bottom:-1px;
  border:none;border-bottom:2px solid transparent;
  background:none;border-radius:0!important;
}
.tabs button:hover{color:var(--text);background:transparent}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.tabs .n{color:var(--faint);font-size:var(--fs-1);margin-left:6px;font-variant-numeric:tabular-nums;font-weight:400}
.tabs button.on .n{color:var(--accent)}

.banner{
  background:rgba(216,180,119,.08);color:var(--mod);
  border-bottom:1px solid rgba(216,180,119,.2);
  font-size:var(--fs-2);padding:7px 14px;
}
.banner.info{background:rgba(141,174,255,.07);color:var(--accent);border-color:var(--accent-line)}

/* ---------------------------------------------------------------- body */
.body{
  display:flex;min-height:0;overflow:hidden;
  background:var(--shell);
}
.main{
  flex:1;min-width:0;
  padding:24px 28px 72px;
  overflow:auto;
  background:var(--shell);
}
.main-canvas{padding:0;overflow:hidden;display:flex;background:var(--shell)}

/* ================================================================ canvas: three columns */
.cv-layout{
  display:grid;
  grid-template-columns:var(--rail-w) minmax(0,1fr) var(--dt-w);
  flex:1;min-width:0;min-height:0;
}
.cv-layout.rail-off{grid-template-columns:0px minmax(0,1fr) var(--dt-w)}
.cv-layout.dt-off{grid-template-columns:var(--rail-w) minmax(0,1fr) 0px}
.cv-layout.rail-off.dt-off{grid-template-columns:0px minmax(0,1fr) 0px}

/* ---------------------------------------------------------------- left rail */
.cv-list{
  width:auto;min-width:0;
  background:var(--rail);
  border-right:1px solid var(--line);
  padding:12px 8px 40px;
  overflow:auto;
  display:flex;flex-direction:column;gap:2px;
}
/* Collapsing uses width 0 + clipped overflow, not display:none: a grid child that
   stops participating lets the next child slide into column 1, which is 0px wide. */
.cv-layout.rail-off .cv-list{
  display:flex!important;
  width:0!important;min-width:0!important;
  padding:0!important;margin:0!important;border:none!important;
  overflow:hidden!important;visibility:hidden;
}
.cv-layout.dt-off .inspector{
  display:flex!important;
  width:0!important;min-width:0!important;
  padding:0!important;margin:0!important;border:none!important;
  overflow:hidden!important;visibility:hidden;
}
.cv-list>.hint{display:none}
.cv-list>.sec-t{
  font-size:var(--fs-1);letter-spacing:.08em;color:var(--faint);
  font-weight:600;margin:0;padding:0 8px 6px;
}
.cv-list .legend{
  font-size:var(--fs-1);color:var(--faint);gap:14px;
  padding:2px 8px 10px;border-bottom:1px solid var(--line-2);margin-bottom:6px;
}
.cv-list .legend .lg{width:8px;height:8px;border:none;display:inline-block;flex:none}
.cv-sum{margin-bottom:6px;padding:0 4px}
.cv-sum summary{
  font-size:var(--fs-1);font-weight:600;color:var(--faint);
  letter-spacing:.06em;padding:4px 4px;cursor:pointer;
}
.cv-sum .summary{font-size:var(--fs-2);color:var(--muted);line-height:1.65;margin:2px 0 10px;padding:0 4px}
.rail-hint{font-size:var(--fs-1);color:var(--faint);line-height:1.6;padding:2px 8px 10px}

.rail-g{border-top:1px solid var(--line-2);margin-top:4px;padding-top:2px}
.rail-g:first-of-type{border-top:none;margin-top:0}
.rail-g>summary{
  cursor:pointer;list-style:none;display:flex;align-items:center;gap:7px;
  padding:8px 8px;font-size:var(--fs-1);font-weight:600;
  letter-spacing:.07em;color:var(--faint);
}
.rail-g>summary::-webkit-details-marker{display:none}
.rail-g>summary::before{content:"\25BE";font-size:9px;opacity:.7;transition:transform .14s}
.rail-g:not([open])>summary::before{transform:rotate(-90deg)}
.rail-g-n{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:500;opacity:.8}
.rail-g-b{padding-bottom:4px}

.cv-page{
  width:100%;display:flex;align-items:flex-start;gap:7px;
  padding:7px 8px 4px;border:none;background:none;
  font-size:var(--fs-2);font-weight:600;color:var(--muted);
  text-align:left;white-space:normal;
}
.cv-page:hover{color:var(--text);background:transparent}
.cv-page .dot{margin-top:5px;width:5px;height:5px}
.pg-route{font-family:var(--mono);font-size:10.5px;color:var(--faint);line-height:1.5;margin-top:1px}
.rail-key>.cv-page{color:var(--text)}
.rail-key>.cv-page .pg-name::after{
  content:"\672C\6B21";margin-left:6px;font-size:9px;font-weight:600;letter-spacing:.05em;
  color:var(--accent);background:var(--accent-soft);padding:1px 5px;vertical-align:1px;
}

/* Selected row: a soft fill and a 2px accent edge. Nothing glows. */
.cv-item{
  width:100%;display:flex;align-items:flex-start;gap:8px;
  padding:6px 8px 6px 9px;margin:1px 0;
  border:none;border-left:2px solid transparent;
  background:none;text-align:left;white-space:normal;
  transition:background .12s ease,border-color .12s ease;
}
.cv-item:hover{background:rgba(255,255,255,.035)}
.cv-item.on{background:var(--accent-soft);border-left-color:var(--accent)}
.cv-item-b{display:flex;flex-direction:column;gap:1px;min-width:0}
.cv-item-t{font-size:var(--fs-2);font-weight:500;color:var(--text);line-height:1.45}
.cv-item.on .cv-item-t{color:var(--text)}
.cv-item-n{font-size:var(--fs-1);color:var(--faint);line-height:1.5}
.u-dot{
  min-width:17px;height:17px;font-size:10px;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;
  font-variant-numeric:tabular-nums;color:var(--muted);
  background:rgba(255,255,255,.06);border-radius:var(--r-1)!important;
}
.u-dot.u-added{background:var(--add-soft);color:var(--add)}
.u-dot.u-removed{background:var(--del-soft);color:var(--del)}
.u-dot.u-modified{background:var(--mod-soft);color:var(--mod)}
.cv-q{
  margin-top:10px;padding:8px 10px;
  background:rgba(216,180,119,.07);border:1px solid rgba(216,180,119,.22);
  color:var(--mod);font-size:var(--fs-2);line-height:1.5;text-align:left;
}
.cv-q:hover{border-color:var(--accent-line);color:var(--accent)}

/* ---------------------------------------------------------------- canvas */
.cv-vp{
  position:relative;isolation:isolate;
  background-color:var(--shell);
  overflow:hidden;
  min-width:0;min-height:0;height:100%;
}
/* The sky fills the viewport box, sits under everything, and never eats pointer events. */
#aurora{
  position:absolute!important;inset:0!important;
  width:100%!important;height:100%!important;
  display:block;z-index:0;pointer-events:none;margin:0;border:0;
}
.cv-vp::before{
  content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(90% 60% at 24% -12%, rgba(38,74,96,.42), transparent 66%),
    radial-gradient(60% 45% at 86% 8%, rgba(64,120,128,.16), transparent 70%),
    linear-gradient(180deg,#0E141B 0%,#0B1016 58%,#090D12 100%);
}
.cv-world{
  position:absolute;left:0;top:0;transform-origin:0 0;
  z-index:1;gap:80px;padding:32px 36px;
}
.cv-group{gap:28px}
.cv-frame{
  border:1px solid var(--line);
  background:var(--surface);
  box-shadow:0 20px 48px -28px rgba(0,0,0,.9);
}
.cv-fh{
  background:rgba(255,255,255,.02);
  border-bottom:1px solid var(--line);
  font-size:var(--fs-4);font-weight:600;color:var(--text);
  padding:10px 16px;gap:9px;
  border-radius:var(--r-4) var(--r-4) 0 0!important;
}
.cv-fh .dot{width:5px;height:5px}
.cv-fb{padding:20px 18px 18px}
.cv-ov{border:1px solid var(--line);background:var(--surface);padding:14px}
.cv-ovh{color:var(--muted);font-size:var(--fs-1);letter-spacing:.04em;font-weight:600}
.cv-ovdrop{
  border:1px dashed var(--line-3);color:var(--faint);
  background:rgba(255,255,255,.012);font-size:var(--fs-2);
}
.route{
  font-family:var(--mono);font-size:var(--fs-1);color:var(--muted);
  background:rgba(255,255,255,.04);border:none;padding:1px 6px;
}

/* Canvas controls live bottom-left, React Flow style: one cluster, two jobs.
   Zoom and fit are immediate; display switches sit behind one button. */
.cv-tools{
  position:absolute;top:auto;right:auto;left:14px;bottom:14px;z-index:20;
  display:flex;align-items:center;gap:2px;
  padding:3px;background:rgba(27,32,39,.92);
  border:1px solid var(--line-3);
  box-shadow:0 10px 30px -14px rgba(0,0,0,.95);
  backdrop-filter:blur(6px);
  cursor:default;
  max-width:none;flex-wrap:nowrap;
  width:auto;height:auto;
}
.cv-tools button{
  border:none;background:none;color:var(--muted);
  padding:5px 8px;font-size:var(--fs-2);border-radius:var(--r-1)!important;
  line-height:1;
}
.cv-tools button:hover:not(:disabled){background:rgba(255,255,255,.07);color:var(--text)}
.cv-tools button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.cv-zoom{
  font-family:var(--mono);font-size:var(--fs-1);color:var(--faint);
  min-width:38px;text-align:center;font-variant-numeric:tabular-nums;
}
.cv-sep{width:1px;height:16px;background:var(--line-3);margin:0 3px}
.cv-hint{
  position:absolute;top:auto;right:auto;left:14px;bottom:14px;z-index:19;
  display:none;
}

/* fit-mode segmented control inside the cluster */
.cv-fitseg{display:inline-flex;gap:0;border-left:1px solid var(--line-3);margin-left:3px;padding-left:3px}
.cv-fitseg button{border:none;background:none;color:var(--muted);padding:5px 8px;font-size:var(--fs-2)}
.cv-fitseg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}

/* display switches, revealed by the "display" button */
.cv-disp{
  position:absolute;left:0;bottom:calc(100% + 8px);
  min-width:184px;padding:5px;
  background:var(--overlay);border:1px solid var(--line-3);
  border-radius:var(--r-3)!important;
  box-shadow:0 18px 44px -16px rgba(0,0,0,.95);
  display:flex;flex-direction:column;gap:1px;
}
.cv-disp button{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  width:100%;text-align:left;padding:6px 8px;color:var(--text-2);
}
.cv-disp button:hover{background:rgba(255,255,255,.06);color:var(--text)}
.cv-disp button.on{color:var(--accent)}
.cv-disp .st{font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums}
.cv-disp button.on .st{color:var(--accent)}

/* rail / inspector toggles pinned to the canvas top corners */
.pane-toggle{
  position:absolute;top:12px;z-index:22;
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 9px;font-size:var(--fs-2);
  background:rgba(27,32,39,.9);border:1px solid var(--line-3);
  color:var(--muted);cursor:pointer;
  backdrop-filter:blur(6px);
}
.pane-toggle:hover{color:var(--text);border-color:var(--line-3);background:rgba(36,42,51,.95)}
.pane-toggle.l{left:12px}
.pane-toggle.r{right:12px}

/* ================================================================ right inspector */
.inspector{
  background:var(--rail);
  border-left:1px solid var(--line);
  padding:14px 14px 40px;
  overflow:auto;
  display:flex;flex-direction:column;gap:12px;
  min-width:0;max-width:100%;box-sizing:border-box;
}
.inspector.dt{width:100%;min-width:0;max-width:100%;box-sizing:border-box}
.ins-top{
  display:flex;justify-content:space-between;align-items:center;
  font-size:var(--fs-1);color:var(--faint);letter-spacing:.04em;
  padding-bottom:10px;border-bottom:1px solid var(--line);
}
.ins-head{font-size:var(--fs-5);font-weight:600;color:var(--text);gap:8px;line-height:1.4;display:flex;align-items:center;flex-wrap:wrap}
.dt-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:var(--fs-5);font-weight:600}
.ins-type{
  background:rgba(255,255,255,.06);color:var(--muted);border:none;
  font-size:10px;letter-spacing:.05em;padding:1px 6px;font-weight:500;
}
.ins-path{font-size:var(--fs-2);color:var(--faint);line-height:1.6;display:flex;gap:6px;flex-wrap:wrap;align-items:baseline}
.ins-path code{font-size:var(--fs-1);color:var(--muted)}
.ins-note{
  background:rgba(216,180,119,.08);border-left:2px solid var(--mod);
  color:#E4C896;font-size:var(--fs-2);padding:8px 10px;line-height:1.6;
  border-radius:0 var(--r-1) var(--r-1) 0!important;
}
.ins-tip{font-size:var(--fs-2);color:var(--faint);line-height:1.6}
.dt-unit{display:flex;flex-direction:column;gap:14px}
.dt-cmp{display:flex;flex-direction:column;gap:14px}
.dt-render{
  border:1px solid var(--line);background:var(--surface);
  padding:16px 12px 12px;overflow:auto;max-height:460px;
}
.dt-void{
  border:1px dashed var(--line-3);color:var(--faint);
  background:transparent;font-size:var(--fs-2);line-height:1.6;padding:14px;text-align:center;
}
.dt-block{border-top:1px solid var(--line);padding-top:10px}
.dt-sec{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.dt-list{margin:0;padding-left:16px;font-size:var(--fs-2);line-height:1.65;color:var(--text-2)}
.dt-list li{padding:3px 0}
.dt-list.fns{list-style:none;padding-left:0}
.dt-list.fns code{font-size:var(--fs-1);color:var(--muted)}
.side-t{
  font-size:var(--fs-1);font-weight:600;letter-spacing:.07em;
  color:var(--faint);margin:0 0 8px;display:flex;gap:7px;align-items:center;
}
.side-before>.side-t::before{content:"";width:8px;height:1px;background:var(--del)}
.side-after>.side-t::before{content:"";width:8px;height:1px;background:var(--add)}
.diff{border:1px solid var(--line);padding:9px 10px;background:var(--surface-2)}
.diff-row{font-size:var(--fs-2);display:flex;gap:8px;flex-wrap:wrap;align-items:baseline;line-height:1.6}
.dk{color:var(--faint);min-width:54px}
.dv.old{color:var(--del);text-decoration:none;background:var(--del-soft);padding:0 4px}
.dv.new{color:var(--add);background:var(--add-soft);padding:0 4px}
.fields{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:var(--fs-1);color:var(--faint);letter-spacing:.04em}
.fld input,.fld select,.fld textarea{font-size:var(--fs-2);color:var(--text);padding:6px 8px}
.acts{display:flex;flex-wrap:wrap;gap:5px}
.cbox{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:7px}
.row2{display:flex;gap:6px}
.cmt{
  border:none;border-left:2px solid var(--accent-line);
  padding:9px 10px;font-size:var(--fs-2);
  background:rgba(255,255,255,.03);display:flex;flex-direction:column;gap:3px;margin-bottom:6px;
}
.cmt-meta{display:flex;gap:7px;align-items:center;flex-wrap:wrap;color:var(--faint);font-size:var(--fs-1)}
.sev{
  font-size:9.5px;padding:0 5px;font-weight:600;letter-spacing:.04em;
  line-height:15px;color:var(--del);background:var(--del-soft);
}
.sev.s1{color:var(--mod);background:var(--mod-soft)}
.sev.s2{color:var(--accent);background:var(--accent-soft)}
.where{color:var(--accent);font-size:var(--fs-1);cursor:pointer;border:none;background:none;padding:0;text-align:left;white-space:normal}
.ctext{white-space:pre-wrap;color:var(--text-2);font-size:var(--fs-2);line-height:1.65}

/* Right column when nothing is selected: the third column stays, empty and quiet. */
.inspector.insp-empty{justify-content:flex-start;gap:8px;padding-top:18px}
.ins-empty-t{
  font-size:var(--fs-1);letter-spacing:.08em;font-weight:600;color:var(--faint);
  padding-bottom:10px;border-bottom:1px solid var(--line);
}
.ins-empty-p{font-size:var(--fs-2);color:var(--faint);line-height:1.65;margin:0}

/* ================================================================ non-canvas views */
.card{
  background:var(--surface);border:1px solid var(--line);
  padding:18px 20px;margin-bottom:18px;box-shadow:none;
}
.card h2{font-size:var(--fs-6);font-weight:600;margin:0 0 5px;color:var(--text)}
.card h3{font-size:var(--fs-5);font-weight:600;margin:0 0 10px;color:var(--text)}
.sec-t{font-size:var(--fs-1);letter-spacing:.08em;color:var(--faint);font-weight:600}
.muted{color:var(--muted)}
.hint{color:var(--faint);font-size:var(--fs-1)}
.empty{padding:40px;text-align:center;color:var(--faint)}

/* flows */
.flow-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.flow-head h3{margin:0;font-size:var(--fs-5)}
.flow-head .muted{font-size:var(--fs-2);color:var(--faint);line-height:1.5}
.lanes{display:grid;gap:0 1px;position:relative}
.lane-h{
  font-size:var(--fs-1);font-weight:600;letter-spacing:.08em;
  color:var(--muted);text-align:center;padding:0 0 8px;
  border-bottom:1px solid var(--line);background:none;
}
.lane-bg{background:rgba(255,255,255,.014);border:none;border-left:1px solid var(--line-2);border-right:1px solid var(--line-2);border-radius:0!important}
.frame{
  position:relative;background:#151A20;border:1px solid var(--line);
  padding:16px 14px;min-height:120px;box-shadow:none;
}
.frame.void{
  display:flex;align-items:center;justify-content:center;
  color:var(--faint);border-style:dashed;min-height:200px;
  background:repeating-linear-gradient(135deg,rgba(255,255,255,.012),rgba(255,255,255,.012) 9px,transparent 9px,transparent 18px);
}
.compare{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.step{
  position:relative;z-index:1;background:var(--surface-2);
  border:1px solid var(--line);padding:8px 10px;margin:0 5px;
  cursor:pointer;box-shadow:none;
  transition:border-color .12s ease,background .12s ease;
}
.step:hover{border-color:var(--line-3);background:#232A33}
.step-t{font-size:var(--fs-4);line-height:1.55;color:var(--text)}
.step .wf-fn{margin-top:6px;font-size:var(--fs-1)}
.step.k-decision{border-style:dashed;border-color:rgba(216,180,119,.42);background:rgba(216,180,119,.05)}
.step.k-note{background:rgba(216,180,119,.07);border-color:rgba(216,180,119,.26)}
.step-n{
  z-index:1;width:19px;height:19px;border-radius:50%!important;
  background:transparent;border:1px solid var(--line-3);color:var(--faint);
  font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;
  align-self:center;font-variant-numeric:tabular-nums;
}
.step.sel,.step.partner{border-color:var(--accent)}
.flow.has-chg .step.step-same{opacity:.78}
.flow.has-chg .step.step-same:hover{opacity:1}
.flow:not(.has-chg) .step.step-same{opacity:1}
.flow.only-chg .step.step-same,.flow.only-chg .step-n.step-same{display:none}
.flow-fold{
  display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-1);
  color:var(--muted);border:1px solid var(--line-3);background:transparent;
  padding:3px 9px;line-height:1.5;font-weight:500;
}
.flow-fold:hover:not(:disabled){border-color:var(--accent-line);color:var(--accent)}
.flow-fold[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);font-weight:600}
.flow-fold:disabled{opacity:.38}
.flow-note{font-size:var(--fs-1);color:var(--faint);margin-top:7px;line-height:1.5}
.flow-unchanged{font-size:var(--fs-1);letter-spacing:.04em;color:var(--faint);background:rgba(255,255,255,.04);padding:1px 7px;line-height:15px}
.page-link{font-size:var(--fs-1);color:var(--accent);opacity:.9}
.add-step{margin-top:10px;font-size:var(--fs-2)}

/* backend */
.be-frame{display:flex;flex-direction:column;gap:16px;background:transparent;border:none;padding:0}
.mod{position:relative;border:1px solid var(--line);padding:16px 18px;background:var(--surface);cursor:pointer}
.mod:hover{border-color:var(--line-3)}
.mod-h{display:flex;gap:9px;align-items:baseline;margin-bottom:10px}
.mod-h b{font-size:var(--fs-4);font-weight:600;color:var(--text)}
.mod-items{display:flex;flex-direction:column;gap:0}
.be-item{
  position:relative;display:flex;gap:9px;align-items:baseline;flex-wrap:wrap;
  border:none;border-bottom:1px solid var(--line-2);
  padding:8px 2px;cursor:pointer;background:transparent;border-radius:0!important;
}
.be-item:last-child{border-bottom:none}
.be-item:hover{background:rgba(255,255,255,.025)}
.be-item code{font-family:var(--mono);font-size:var(--fs-3);color:var(--text-2);letter-spacing:-.01em}
.be-note{font-size:var(--fs-2);color:var(--faint);line-height:1.5}

/* feedback */
.fb{max-width:940px}
.summary{white-space:pre-wrap;margin:4px 0 10px;color:var(--text-2);font-size:var(--fs-3);line-height:1.7}
.chg-list{margin:0;padding:0;list-style:none}
.chg-list li{padding:7px 0;border-bottom:1px solid var(--line-2);display:flex;gap:9px;align-items:baseline;font-size:var(--fs-3)}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{border:1px solid var(--line);padding:9px 12px;min-width:140px;background:var(--surface-2)}
.stat-l{font-size:var(--fs-1);color:var(--faint);letter-spacing:.04em}
.stat-v{display:flex;gap:8px;font-weight:600;font-size:var(--fs-5);font-variant-numeric:tabular-nums;margin-top:2px;color:var(--text)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;font-size:var(--fs-1);color:var(--faint)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.q{margin-bottom:12px}
.q-t{font-weight:600;margin-bottom:5px;font-size:var(--fs-3);color:var(--text-2)}
.q-opts{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px}
.q-opts button{font-size:var(--fs-2);padding:4px 10px}
.q-opts button.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);font-weight:600}
.md{
  white-space:pre-wrap;background:var(--surface-2);border:1px solid var(--line);
  padding:12px 14px;max-height:420px;overflow:auto;
  font:var(--fs-2)/1.65 var(--mono);color:var(--text-2);
}
textarea.md{width:100%;height:400px;resize:vertical;display:block;font-size:var(--fs-2)}
.export-acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.ops{margin:0;padding-left:20px;font-size:var(--fs-3);line-height:1.7;color:var(--text-2)}
.ops li{padding:3px 0}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.tags button{font-size:var(--fs-1);padding:3px 10px}
.tags button.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);font-weight:600}
.notes-help{font-size:var(--fs-1);color:var(--faint);line-height:1.5}

/* ================================================================ wireframe: type and surface, not outlines */
.wf{border:1px solid transparent;background:transparent;padding:8px 10px}
.wf:hover{border-color:rgba(255,255,255,.06)}
.wf.is-c{border-color:transparent;background:transparent}
.wf.t-card,.wf.t-section,.wf.t-panel,.wf.t-group{background:rgba(255,255,255,.022);border-color:transparent}
.wf.t-card>.wf-cap,.wf.t-section>.wf-cap,.wf.t-panel>.wf-cap{
  color:var(--text);border-bottom:1px solid var(--line-2);padding-bottom:6px;margin-bottom:8px;
}
.wf-cap{font-size:var(--fs-2);font-weight:600;color:var(--text-2);margin-bottom:5px;line-height:1.45}
.wf-h{font-size:var(--fs-5);font-weight:600;color:var(--text)}
.wf-text{color:var(--text-2);font-size:var(--fs-4);line-height:1.6}
.wf-lbl{color:var(--text);font-size:var(--fs-4)}
.wf-sub{color:var(--muted);font-size:var(--fs-2);line-height:1.6;margin-top:3px}
.wf-same{color:var(--faint);font-size:var(--fs-1)}
.wf-flabel{font-size:var(--fs-1);color:var(--muted);margin-bottom:3px}
.wf-empty{border:1px dashed var(--line-3);color:var(--faint);font-size:var(--fs-2);padding:7px}
/* Code stays neutral; colour is reserved for meaning. */
.wf-fn{
  font-family:var(--mono);font-size:var(--fs-1);line-height:1.55;
  color:var(--text-2);background:rgba(255,255,255,.04);
  border:none;border-left:2px solid var(--line-3);
  padding:2px 7px;margin-top:5px;display:inline-block;
}
.wf-note{background:rgba(216,180,119,.09);color:#DFC08C;border-left:2px solid var(--mod);font-size:var(--fs-1);padding:3px 7px;line-height:1.5;border-radius:0!important}
.wf-comp{background:rgba(255,255,255,.05);border:none;color:var(--muted);font-size:9.5px;padding:1px 4px}
.wf.t-button{border:1px solid var(--line-3);background:rgba(255,255,255,.04);padding:5px 10px}
.wf.t-button .wf-lbl{color:var(--text);font-size:var(--fs-2);font-weight:500}
.wf.t-button:hover{background:rgba(255,255,255,.07)}
.wf.t-button.v-primary{background:var(--accent-soft);border-color:var(--accent-line)}
.wf.t-button.v-primary .wf-lbl{color:var(--accent);font-weight:600}
.wf.t-button.v-primary .wf-fn{background:transparent;border:none;color:var(--accent);opacity:.85;padding-left:0}
.wf.t-button.v-ghost{border-color:transparent;background:transparent}
.wf.t-button.v-ghost .wf-lbl{color:var(--muted)}
.wf.t-button.v-danger{border-color:rgba(229,139,148,.34)}
.wf.t-button.v-danger .wf-lbl{color:var(--del)}
.wf.t-link{border-color:transparent;background:transparent}
.wf.t-link .wf-lbl{color:var(--accent);text-decoration:none}
.wf.t-badge,.wf.t-tag{border:none;background:rgba(255,255,255,.06);font-size:var(--fs-1);padding:1px 7px;color:var(--muted)}
.wf.t-divider{border:none;background:none;padding:3px 0}
.wf.t-divider hr{border:none;border-top:1px solid var(--line)}
.wf-field{border:none;border-bottom:1px solid var(--line-3);color:var(--faint);background:transparent;font-size:var(--fs-2);min-height:24px;padding:3px 2px}
.wf-media{background:rgba(255,255,255,.03);border:none;color:var(--faint);font-size:var(--fs-2);background-image:none}
.wf-media.chart{background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:24px 20px}
.wf-stat{font-size:var(--fs-7);font-weight:600;color:var(--text)}
.wf-stat.sm{font-size:var(--fs-3);font-weight:500}
.wf-bars i{background:rgba(255,255,255,.08)}
.wf-items{gap:5px;margin-top:3px}
.wf-it{border:none;background:transparent;font-size:var(--fs-2);padding:1px 0;color:var(--text-2);line-height:1.55}
.wf-items.col .wf-it{width:100%;padding:4px 0;border-bottom:1px solid var(--line-2)}
.wf-items.col .wf-it:last-child{border-bottom:none}
.wf-it.is-cmd{font-family:var(--mono);font-size:var(--fs-1)}
.wf-table{border:none;border-top:1px solid var(--line);overflow:visible;border-radius:0!important}
.wf-table .th{
  background:transparent;border-bottom:1px solid var(--line);border-right:none;
  font-size:var(--fs-1);font-weight:600;letter-spacing:.06em;color:#9AA4B2;
  padding:5px 10px 5px 0;
}
.wf-table .td{border-bottom:1px solid var(--line-2);border-right:none;height:22px;background:transparent}
.wf-table .td::after{background:rgba(255,255,255,.09);top:9px;height:3px;left:0;right:34%}
.wf-toggle{background:rgba(141,174,255,.34);border:none}
.wf.is-trigger::after{color:var(--accent);font-size:9px;opacity:.8}
.cond-tag,.st-tag{border:1px solid var(--line-3);color:var(--muted);background:var(--surface);font-size:9.5px;padding:1px 6px}

/* ================================================================ change marks
   The generator ships .mk-* and .chg-* with !important light backgrounds. One grouped
   override per concern replaces them; the rest of the styling wins on specificity. */
#cv-world .mk-added,#cv-world .mk-removed,#cv-world .mk-modified,#cv-world .mk-u{outline:none!important;background-color:transparent!important}
#cv-world .mk-added{box-shadow:inset 3px 0 0 var(--add)!important}
#cv-world .mk-removed{box-shadow:inset 3px 0 0 var(--del)!important}
#cv-world .mk-modified{box-shadow:inset 3px 0 0 var(--mod)!important}
#cv-world .mk-u{box-shadow:inset 3px 0 0 currentColor,0 0 0 1px var(--line)!important}

#app .wf.chg-added,#app .wf.chg-removed,#app .wf.chg-modified{outline:none!important;background-color:transparent!important}
#app .wf.chg-added{background-color:rgba(116,198,157,.055)!important}
#app .wf.chg-removed{background-color:rgba(229,139,148,.055)!important}
#app .wf.chg-modified{background-color:rgba(216,180,119,.055)!important}
#app .wf-it.chg-added{background-color:rgba(116,198,157,.07)!important}
#app .wf-it.chg-removed{background-color:rgba(229,139,148,.07)!important}
#app .wf-it.chg-modified{background-color:rgba(216,180,119,.07)!important}
#app .th.chg-added{background-color:rgba(116,198,157,.06)!important}
#app .th.chg-removed{background-color:rgba(229,139,148,.06)!important}
#app .th.chg-modified{background-color:rgba(216,180,119,.06)!important}
#app .step.chg-added{background-color:#1A2A24!important}
#app .step.chg-removed{background-color:#2A1C1F!important}
#app .step.chg-modified{background-color:#2A2419!important}
#app .step.side-before.chg-modified{background-color:#2A1C1F!important}
#app .be-item.chg-added{background-color:rgba(116,198,157,.05)!important}
#app .be-item.chg-removed{background-color:rgba(229,139,148,.05)!important}
#app .be-item.chg-modified{background-color:rgba(216,180,119,.05)!important}
#app .mod.chg-added,#app .mod.chg-removed,#app .mod.chg-modified{background-color:var(--surface)!important}
#app .chip.c-added{background:none!important;color:var(--add)!important}
#app .chip.c-removed{background:none!important;color:var(--del)!important}
#app .chip.c-modified{background:none!important;color:var(--mod)!important}
#app .legend .lg{display:inline-block!important;width:8px!important;min-width:8px!important;max-width:8px!important;height:8px!important;flex:0 0 8px!important;border:none!important}
#app .legend .lg.mod{background:var(--mod)!important;color:var(--mod)!important}
#app .legend .lg.add{background:var(--add)!important;color:var(--add)!important}
#app .legend .lg.rm{background:var(--del)!important;color:var(--del)!important}

.mk-added{outline:none;background-color:transparent;box-shadow:inset 3px 0 0 var(--add)}
.mk-removed{outline:none;background-color:transparent;box-shadow:inset 3px 0 0 var(--del)}
.mk-modified{outline:none;background-color:transparent;box-shadow:inset 3px 0 0 var(--mod)}
.cv-frame.mk-added{box-shadow:inset 0 0 0 1px rgba(116,198,157,.22),0 20px 48px -28px rgba(0,0,0,.9)}
.cv-frame.mk-removed{box-shadow:inset 0 0 0 1px rgba(229,139,148,.22),0 20px 48px -28px rgba(0,0,0,.9)}
.cv-frame.mk-modified{box-shadow:inset 0 0 0 1px rgba(216,180,119,.2),0 20px 48px -28px rgba(0,0,0,.9)}
.mk-removed.mk-u>.wf-children,.mk-removed.mk-u>.wf-cap,.mk-removed.mk-u>.wf-lbl,.mk-removed.mk-u>.wf-text{opacity:.6}

.u-num{
  position:absolute;top:-8px;left:12px;z-index:7;
  min-width:auto;height:auto;line-height:1.5;padding:1px 6px;
  font-size:var(--fs-1);font-weight:600;letter-spacing:.02em;
  color:var(--text-2);background:var(--overlay);
  box-shadow:0 0 0 1px var(--line-3);
  pointer-events:none;font-variant-numeric:tabular-nums;
}
.u-num.u-added{color:var(--add);box-shadow:0 0 0 1px rgba(116,198,157,.34)}
.u-num.u-removed{color:var(--del);box-shadow:0 0 0 1px rgba(229,139,148,.34)}
.u-num.u-modified{color:var(--mod);box-shadow:0 0 0 1px rgba(216,180,119,.34)}
.u-added{background:var(--add-soft);color:var(--add)}
.u-removed{background:var(--del-soft);color:var(--del)}
.u-modified{background:var(--mod-soft);color:var(--mod)}
.u-tag{display:none}
.chg-tag{
  position:absolute;top:-7px;left:9px;z-index:6;
  font-size:9px;line-height:14px;height:14px;padding:0 5px;
  font-weight:600;letter-spacing:.05em;
  color:var(--add);background:var(--surface);
  box-shadow:0 0 0 1px rgba(116,198,157,.34);
  pointer-events:none;white-space:nowrap;
}
.chg-tag-removed,.chg-tag-modified.side-before{color:var(--del);box-shadow:0 0 0 1px rgba(229,139,148,.34)}
.chg-tag-modified,.chg-tag-modified.side-after{color:var(--mod);box-shadow:0 0 0 1px rgba(216,180,119,.34)}
.mk-u>.chg-tag,.cv-frame>.chg-tag{left:auto;right:9px}
.cmt-badge{
  position:absolute;top:-7px;right:-4px;z-index:4;
  background:var(--overlay-2);color:var(--text-2);
  font-size:9px;line-height:14px;padding:0 5px;font-weight:600;
  box-shadow:0 0 0 1px var(--line-3);
}
.chip{border:none;background:none;font-size:var(--fs-1);font-weight:600;letter-spacing:.04em;padding:0;line-height:1.5;color:var(--faint)}
.chip.sm{font-size:var(--fs-1)}
.chip.c-added{color:var(--add);background:none}
.chip.c-removed{color:var(--del);background:none}
.chip.c-modified{color:var(--mod);background:none}
.dot{width:5px;height:5px;flex:none}
.dot-added{background:var(--add)}.dot-removed{background:var(--del)}
.dot-modified{background:var(--mod)}.dot-unchanged{background:#4A5361}

.u-sel{box-shadow:0 0 0 1px var(--accent),0 0 0 5px rgba(141,174,255,.14)!important}
.sel{outline:1px solid var(--accent);outline-offset:1px}
.partner{outline:1px solid var(--line-3);outline-offset:1px}

/* dimming scopes */
.cv-world.dim-pages .cv-frame.is-unchanged{opacity:.72;transition:opacity .16s}
.cv-world.dim-pages .cv-frame.is-unchanged:hover{opacity:1}
.cv-frame.is-unchanged>.cv-fh{color:var(--faint)}
.cv-world.dim-nodes .wf.is-leaf:not(.chg):not(.mk),
.cv-world.dim-nodes .wf.is-c:not(.chg):not(.mk)>.wf-cap,
.cv-world.dim-nodes .wf:not(.chg):not(.mk)>.wf-same{opacity:.7}

/* ================================================================ comparison */
.cmp-bar{display:flex;align-items:center;gap:9px;margin:0 0 12px;padding-bottom:10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.cmp-lab{font-size:var(--fs-1);letter-spacing:.07em;color:var(--faint);font-weight:600}
.cmp-seg{display:inline-flex;border:1px solid var(--line-3);overflow:hidden;background:rgba(255,255,255,.02)}
.cmp-seg button{border:none;padding:4px 10px;font-size:var(--fs-1);color:var(--muted);background:transparent;font-weight:500}
.cmp-seg button+button{border-left:1px solid var(--line)}
.cmp-seg button:hover{background:rgba(255,255,255,.05);color:var(--text)}
.cmp-seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.dt-cmp[data-cmp="before"]>.side-after,.dt-cmp[data-cmp="after"]>.side-before,
.compare[data-cmp="before"]>.side-after,.compare[data-cmp="after"]>.side-before{display:none}
.compare[data-cmp="before"],.compare[data-cmp="after"]{grid-template-columns:minmax(0,1fr)}
.cmp-scope{font-size:var(--fs-1);color:var(--faint);line-height:1.5}

/* ================================================================ controls */
input,select,textarea{
  border:1px solid var(--line-3);padding:6px 9px;
  background:rgba(255,255,255,.03);font-size:var(--fs-2);color:var(--text);
  transition:border-color .12s ease,background .12s ease;
}
input::placeholder,textarea::placeholder{color:var(--faint)}
input:hover,select:hover,textarea:hover{border-color:rgba(255,255,255,.2)}
input:focus,select:focus,textarea:focus{border-color:var(--accent-line);outline:none;box-shadow:0 0 0 3px rgba(141,174,255,.12)}
button{
  font-size:var(--fs-2);padding:5px 11px;
  border:1px solid var(--line-3);background:rgba(255,255,255,.035);
  color:var(--text-2);line-height:1.5;font-weight:500;
  transition:background .12s ease,border-color .12s ease,color .12s ease;
}
button:hover:not(:disabled){background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.2);color:var(--text)}
button:disabled{opacity:.36}
button.primary{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);font-weight:600}
button.primary:hover:not(:disabled){background:rgba(141,174,255,.2)}
button.danger{color:var(--del);border-color:rgba(229,139,148,.3);background:rgba(229,139,148,.06)}
button.ok{color:var(--add);border-color:rgba(116,198,157,.3);background:rgba(116,198,157,.06)}
button.ok.on{background:rgba(116,198,157,.18);color:var(--add)}
button.lnk{border-color:transparent;background:none;color:var(--accent);padding:1px 5px;font-weight:500}
button.lnk:hover:not(:disabled){background:rgba(141,174,255,.1)}
button.lnk.danger{color:var(--del)}
.pal-item{border:1px dashed var(--line-3);background:transparent;font-size:var(--fs-1);color:var(--muted);padding:3px 8px;cursor:grab}
.pal-item:hover{border-color:var(--accent-line);color:var(--accent);background:var(--accent-soft)}
.palette{
  display:flex;flex-wrap:wrap;gap:9px;align-items:center;
  background:var(--overlay);border:1px solid var(--line-3);
  padding:5px 9px;box-shadow:0 12px 32px -14px rgba(0,0,0,.9);
}
.pal-g{display:inline-flex;gap:4px;align-items:center;flex-wrap:wrap}
.pal-gt{font-size:10px;color:var(--faint);letter-spacing:.04em}
.edit-hint{font-size:var(--fs-2);color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent-line);padding:6px 10px;margin-bottom:8px}

/* ================================================================ overlays */
.modal-back{position:absolute;inset:0;z-index:30;background:rgba(6,9,13,.72);display:flex;justify-content:flex-start;align-items:flex-start;padding:30px 20px}
.modal-box{background:var(--overlay);border:1px solid var(--line-3);padding:10px 14px 14px;min-width:0;max-width:100%;max-height:100%;overflow:auto;box-shadow:0 28px 70px -20px rgba(0,0,0,.95)}
.modal-x{text-align:right;margin-bottom:8px}
.toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
  background:var(--overlay-2);color:var(--text);
  padding:8px 14px;z-index:99;max-width:80vw;
  border:1px solid var(--line-3);box-shadow:0 14px 36px -14px rgba(0,0,0,.95);
  font-size:var(--fs-2);
}
.toast.err{background:#3A1A1F;border-color:rgba(229,139,148,.4);color:#F0B4BA}
.drag-ghost{position:fixed;z-index:999;pointer-events:none;background:var(--overlay-2);color:var(--text);padding:2px 8px;font-size:var(--fs-2);white-space:nowrap;box-shadow:0 0 0 1px var(--line-3)}
.drag-ghost.no{background:#333B46;color:var(--muted)}
.trig-list{display:flex;flex-direction:column;gap:2px;max-height:180px;overflow:auto;border:1px solid var(--line-3);padding:4px 6px;color:var(--text);background:rgba(255,255,255,.03)}
.trig-opt{display:flex;align-items:center;gap:4px;font-size:var(--fs-2)}
.cv-links{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;z-index:4}
.cv-link{fill:none;stroke-width:1.4;opacity:.75}
.cv-link.dashed{stroke-dasharray:6 5}
.cv-link.on{stroke-width:1.8;opacity:.9}
.cv-link-lab{font-size:10px;font-weight:600;paint-order:stroke;stroke:var(--shell);stroke-width:4px;text-anchor:middle;dominant-baseline:middle}

/* play mode */
.pl-side{width:270px;flex:none;border-right:1px solid var(--line);background:var(--rail);overflow:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.pl-main{flex:1;min-width:0;display:flex;flex-direction:column}
.pl-bar{display:flex;gap:8px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--line);background:var(--shell);flex-wrap:wrap}
.pl-stage{flex:1;overflow:auto;background:#0A0E13;padding:28px}
.pl-wrap{margin:0 auto;position:relative}
.pl-frame{position:relative;background:var(--surface);border:1px solid var(--line-3);transform-origin:0 0;box-shadow:0 26px 64px -24px rgba(0,0,0,.95)}
.pl-fh{display:flex;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);font-size:var(--fs-3);font-weight:600;color:var(--text-2)}
.pl-fb{padding:16px}
.pl-frame .wf{cursor:default}
.pl-frame [data-ia]{cursor:pointer}
.pl-frame [data-ia]:hover{outline:1px solid var(--accent-line);outline-offset:1px}
.pl-back{position:absolute;inset:0;z-index:30}
.pl-back.dim{background:rgba(4,7,11,.7)}
.pl-back-modal{display:flex;justify-content:center;align-items:flex-start}
.pl-back-modal .pl-ov{position:sticky;top:40px;margin-top:70px}
.pl-back-drawer{display:flex;justify-content:flex-end}
.pl-back-drawer .pl-ov{min-height:100%;border-width:0 0 0 2px}
.pl-back-menu .pl-ov,.pl-back-popover .pl-ov{position:absolute}
.pl-ov{background:var(--overlay);border:1px solid var(--line-3);padding:10px;max-width:92%;box-shadow:0 26px 64px -22px rgba(0,0,0,.95)}
.pl-void{padding:80px;text-align:center;color:var(--faint);border:1px dashed var(--line-3)}
.pl-frame .wf-fn,.pl-frame .wf-same,.pl-frame .cmt-badge{display:none}

/* inline mono tokens: neutral, never teal */
code.ic{font-family:var(--mono);font-size:.93em;letter-spacing:-.01em;color:var(--text-2);background:rgba(255,255,255,.05);border:none;padding:1px 4px;white-space:pre-wrap;word-break:break-word}

/* ================================================================ focus and motion */
:focus{outline:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}

/* ================================================================ drawers on narrow screens */
.drawer-back{display:none}
@media (max-width:1180px){
  :root{--rail-w:220px;--dt-w:290px}
}
@media (max-width:1040px){
  /* Both rails become overlays so the canvas keeps its width; nothing gets crushed. */
  .cv-layout,.cv-layout.rail-off,.cv-layout.dt-off,.cv-layout.rail-off.dt-off{
    grid-template-columns:minmax(0,1fr);
    position:relative;
  }
  .cv-list{
    position:absolute;left:0;top:0;bottom:0;z-index:34;
    width:min(280px,86%);
    display:flex;
    box-shadow:12px 0 36px -14px rgba(0,0,0,.9);
    transform:translateX(-101%);
    transition:transform .18s ease;
  }
  .cv-layout.rail-open .cv-list{transform:translateX(0)}
  .cv-layout.rail-off .cv-list{visibility:visible}
  .inspector.dt{
    position:absolute;right:0;top:0;bottom:0;z-index:34;
    width:min(360px,92%);
    display:flex;
    box-shadow:-12px 0 36px -14px rgba(0,0,0,.9);
    transform:translateX(101%);
    transition:transform .18s ease;
  }
  .inspector{position:absolute;right:0;top:0;bottom:0;z-index:34;width:min(360px,92%);
    box-shadow:-12px 0 36px -14px rgba(0,0,0,.9);transform:translateX(101%);transition:transform .18s ease}
  .cv-layout.dt-off .inspector{visibility:visible}
  .cv-layout.dt-open .inspector{transform:translateX(0)}
  .drawer-back{
    display:block;position:absolute;inset:0;z-index:33;
    background:rgba(4,7,11,.62);border:none;padding:0;
  }
  .cv-layout:not(.rail-open):not(.dt-open) .drawer-back{display:none}
  .main{padding:18px 16px 60px}
}
@media (max-width:760px){
  .top{padding:0 10px;gap:6px}
  .top h1{max-width:52vw;font-size:var(--fs-3)}
  .hdr-meta{display:none}
  .tabs{padding:0 8px}
  .tabs button{padding:9px 9px;font-size:var(--fs-2)}
  .main{padding:14px 12px 56px}
  .card{padding:15px 14px}
  .cv-world{padding:16px;gap:48px}
  .cv-frame{max-width:calc(100vw - 32px)}
  .cv-fb{padding:16px 12px}
  .cv-tools{top:auto;left:8px;bottom:8px;right:8px;justify-content:flex-start;overflow-x:auto;height:auto}
  .pl-stage{padding:12px}
  .pl-side{display:none}
  .compare{grid-template-columns:minmax(0,1fr)}
}

</style>

    '- 线框只表达结构和交互，不代表视觉样式；样式/风格类意见在实现时按项目现有设计规范落实。', '');
  if (patch.ops.length) L.push('<details><summary>smyw-patch（相对 v' + BASE.version + ' 的结构修改，' + patch.ops.length + ' 条）</summary>', '', FENCE + 'json', JSON.stringify(patch), FENCE, '', '</details>', '');
  if (withSpec) L.push('<details><summary>revisedSpec（备用：修改后的完整方案 JSON）</summary>', '', FENCE + 'json', JSON.stringify(cleanSpec()), FENCE, '', '</details>', '');
  return L.join('\n');
}
async function copyText(s) {
  try { await navigator.clipboard.writeText(s); return true; } catch (e) { /* blocked: fall through */ }
  const ta = h('textarea', { style: 'position:fixed;left:-9999px;top:0' }); ta.value = s; document.body.append(ta); ta.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch (e2) { ok = false; }
  ta.remove(); return ok;
}
async function copyFeedback() {
  const ok = await copyText(buildMarkdown(ui.includeSpec));
  if (ok) { toast('已复制。粘贴到和 Agent 的对话里发送即可。'); return true; }
  if (ui.tab !== 'feedback') ui.tab = 'feedback';
  toast('浏览器不允许自动复制：已选中全部反馈，请按 Ctrl+C / ⌘C 复制。', true);
  // Select after the toast re-render; render() keeps focus on [data-f] fields and focus re-selects.
  const out = document.getElementById('smyw-out');
  if (out) { out.focus(); out.select(); out.scrollIntoView({ block: 'center' }); }

}
function download(name, text, type) {
  try { const a = h('a', { href: URL.createObjectURL(new Blob([text], { type: type + ';charset=utf-8' })), download: name }); document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); }
  catch (e) { toast('当前环境不允许下载，请改用「复制反馈」。', true); }
}

// ------------------------------------------------------------------ boot
document.addEventListener('keydown', (e) => {
  const tag = document.activeElement ? document.activeElement.tagName : '';
  const typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
  if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z') && !typing) { e.preventDefault(); if (e.shiftKey) redo(); else undo(); }
  else if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || e.key === 'Y') && !typing) { e.preventDefault(); redo(); }
  else if (!typing && (e.key === 'Delete' || e.key === 'Backspace') && ui.mode === 'edit' && ui.sel && ui.sel.kind === 'node' && ui.sel.side === 'after') { e.preventDefault(); const s = ui.sel; mutate(() => opDelete(s.page, s.id)); }
  else if (e.key === 'Escape' && ui.play) { if (ui.play.ovs.length) { ui.play.ovs.pop(); render(); } }
  else if (e.key === 'Escape') { ui.sel = null; ui.unit = null; render(); }
  else if (e.key === ' ' && !typing && ui.tab === 'canvas' && !ui.space && !ui.play) { ui.space = true; const v = vpEl(); if (v) v.classList.add('space'); e.preventDefault(); }
});
validateSel();
render();

/* Programmatic handle (used by tests; also handy from the devtools console). */
document.addEventListener('keyup', (e) => { if (e.key === ' ') { ui.space = false; const v = vpEl(); if (v) v.classList.remove('space'); } });
window.addEventListener('resize', () => { if (ui.tab === 'canvas' && ui.cam) applyCam(); });

window.smyw = {
  get state() { return S; }, ui: ui, render: render, undo: undo, redo: redo, setMode: setMode, setTab: setTab,
  setPage: (id) => { ui.page = id; ui.sel = null; render(); },
  play: { start: startPlay, stop: stopPlay, click: (pid, id) => runIA(pid, id), back: () => playBack(), get state() { return ui.play; } },
  get units() { computeUnits(); return UNITS.map((u) => Object.assign({}, u)); },
  focusUnit: focusUnit, focusNode: focusNode, fit: () => fitCam(false), zoomAt: zoomAt,
  op: {
    move: (pid, id, dest) => mutate(() => opMove(pid, id, dest)),
    add: (pid, type, dest) => mutate(() => opAdd(pid, type, dest || {})),
    remove: (pid, id) => mutate(() => opDelete(pid, id)),

    convert: (pid, id, kind) => mutate(() => opConvert(pid, id, kind || 'modal')),

    edit: (pid, id, field, val) => editor(() => { const p = pageById(pid); const e = p && findNode(p, id); return e && e.n; }, field, { target: { kind: 'node', page: pid, id: id }, name: ref, prefix: () => pfx(pageById(pid)) })(val),
    stepMove: (fid, id, dir) => mutate(() => opStepMove(fid, id, dir)),
