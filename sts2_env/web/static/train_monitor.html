<script>
/* Aurora background for the smyw review workbench.
 *
 * Adapted from the "Aurora / Sky" canvas exporter in FeralUI's Gradient Builder
 * (https://feralui.dev/gradients/aurora-gradient). That tool ships this shader as a
 * downloadable React component, which is the export path it is built for; the
 * rendering maths below is its aurora fragment program with our palette, a lift
 * offset and a brightness governor. It is an adaptation, not a byte-identical copy,
 * and not an official FeralUI release. Design: Sarthak Navalekar (FeralUI, MIT).
 *
 * One full-screen triangle, one fragment shader, no geometry, no post effects.
 * The ribbon is a single spine with domain-warped rays and an asymmetric Gaussian
 * beam: brightness gathers where the curtain folds, and its lower edge is the rim.
 */
(function () {
  'use strict';

  const VS = 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';

  const FS = `precision highp float;
uniform vec2 u_res;
uniform float u_t;
uniform vec3 u_deep;
uniform vec3 u_horizon;
uniform vec3 u_glow;
uniform vec3 u_rim;
uniform float u_drift;
uniform float u_fold;
uniform float u_freq;
uniform vec2 u_dirv;
uniform float u_lift;
uniform float u_gain;

float hash21(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7)))*43758.5453123); }
float noise2(vec2 p){
  vec2 ip = floor(p); vec2 u = fract(p);
  u = u*u*(3.0-2.0*u);
  return mix(mix(hash21(ip), hash21(ip+vec2(1.0,0.0)), u.x), mix(hash21(ip+vec2(0.0,1.0)), hash21(ip+vec2(1.0,1.0)), u.x), u.y);
}
float fbm3(vec2 p){
  float v = 0.0; float a = 0.5;
  mat2 rot = mat2(cos(0.5), sin(0.5), -sin(0.5), cos(0.5));
  for (int i = 0; i < 3; i++) { v += a*noise2(p); p = rot*p*2.02 + vec2(37.0, 17.0); a *= 0.5; }
  return v;
}
float fbm2(vec2 p){
  float v = 0.0; float a = 0.5;
  mat2 rot = mat2(cos(0.5), sin(0.5), -sin(0.5), cos(0.5));
  for (int i = 0; i < 2; i++) { v += a*noise2(p); p = rot*p*2.02 + vec2(37.0, 17.0); a *= 0.5; }
  return v;
}
void main(){
  vec2 st = gl_FragCoord.xy/u_res - 0.5;
  st.x *= u_res.x/u_res.y;
  st = mat2(u_dirv.x, u_dirv.y, -u_dirv.y, u_dirv.x)*st;
  float x = st.x;
  float hv = st.y + 0.5;

  float time = u_t*0.35;

  // night everywhere; only a weak pool of horizon light at the very foot
  float hzp = 1.0 - smoothstep(0.0, 0.22, hv);
  vec3 sky = mix(u_deep, u_horizon, hzp*hzp*0.18);

  // how far the ribbon swoops across the frame
  float amp = 0.05 + u_fold*0.22;
  // one coherent field-aligned lean for every ray, breathing slowly
  float tiltG = (noise2(vec2(time*0.11, 71.3)) - 0.5)*0.9;
  // one spine: the companion strand stays parallel, so no dark pockets between them
  float tiltR = (noise2(vec2(time*0.07, 41.7)) - 0.5)*0.35;
  float wob = (fbm2(vec2(x*u_freq*0.6 + time*u_drift*0.3, time*0.09)) - 0.5)*1.6;
  float ph = time*u_drift*0.7 + wob;
  float sf = u_freq*u_freq*0.65;
  float th = x*sf + ph;
  float th2 = (x + 0.012)*sf + ph;
  float wv = 0.5 + 0.5*(0.78*sin(th) + 0.22*sin(2.0*th + 2.1));
  float wv2 = 0.5 + 0.5*(0.78*sin(th2) + 0.22*sin(2.0*th2 + 2.1));
  float wave = (wv - 0.5)*2.0 + x*tiltR;
  float slope = abs(wv2 - wv)/0.012;

  vec3 aur = vec3(0.0);
  float cover = 0.0;

  for (int i = 0; i < 2; i++) {
    float fi = float(i);
    float freq = u_freq*(1.0 + fi*0.15);
    float drift = u_drift*(0.75 + fi*0.25);
    float nr = smoothstep(0.35, 0.65, fbm2(vec2(x*freq*0.5 + time*drift*0.4 + fi*21.3, fi*3.77 + time*0.07)));
    float wig = fbm3(vec2(x*freq*2.6 + time*drift + fi*3.7, fi*7.31 + time*0.13)) - 0.5;
    float spine = 0.31 + fi*0.12 + amp*wave + u_lift;
    // a ribbon keeps constant perpendicular thickness: the cross-section widens
    // where the spine runs steep, and the edge-on fold stacks into a bright knot
    float m = slope*amp*2.0;
    float widen = sqrt(1.0 + min(m*m*2.5, 5.0));
    float s = (0.17 + u_fold*0.07)*(0.7 + nr*0.85)*(1.0 - fi*0.2)*widen;
    float knotK = 1.0 + (0.25 + 1.15*u_fold)*smoothstep(1.1, 3.0, slope*amp*6.0);
    float surge = 0.78 + 0.22*noise2(vec2(x*1.1 - time*1.3, 5.5 + fi*2.2));
    float L = (0.6 + 0.4*nr)*knotK*surge;
    float u = (hv - spine)/s;
    // field-aligned rays: global lean plus a gentle perspective fan
    float xr = x*freq*(4.5 + 2.0*nr) + wig*2.2 + time*drift*1.6 + max(u, 0.0)*s*(tiltG + x*0.22)*3.0;
    float yr = hv*0.8 + fi*9.13;
    float v = 0.5*noise2(vec2(xr, yr)) + 0.28*noise2(vec2(xr*2.7 + 13.7, yr*1.7 + 5.2))
            + 0.14*noise2(vec2(xr*6.1 + 31.9, yr*2.3 + 11.4)) + 0.08*noise2(vec2(xr*12.3 + 57.1, yr*2.9 + 23.7));
    float soft = 0.55 + 0.45*smoothstep(0.3, 0.7, v);
    float hard = 0.1 + 0.9*smoothstep(0.38, 0.6, v);
    float bn = noise2(vec2(x*freq*1.4 + time*drift*0.8 + fi*17.3, fi*4.77));
    float flick = 0.85 + 0.15*noise2(vec2(x*freq*3.1 + time*2.8, 7.7 + fi*3.0));
    float rayK = mix(soft, hard, u_fold)*(0.45 + 0.55*smoothstep(0.26, 0.72, bn))*flick;
    float kBody = 1.0 - 0.7*fi;
    // no lines anywhere: one soft beam, tighter below, a long fade above.
    // The reference sigma (0.26/0.55) is tuned for a square preview; a wide canvas
    // needs a taller beam or the curtain collapses into a single stripe.
    float d = u - 0.15;
    float sig = d < 0.0 ? 0.26 : 0.55;
    float beam = exp(-(d*d)/(2.0*sig*sig));
    float body = beam*(0.28 + 0.72*rayK);
    float k = kBody*L;
    float peakK = beam*beam*0.75;
    vec3 gcol = mix(u_glow, u_rim, peakK);
    gcol = mix(gcol, u_deep, smoothstep(0.35, 1.05, u)*0.5);
    gcol = mix(gcol, u_horizon, (1.0 - smoothstep(-0.38, -0.12, d))*0.3);
    float gB = body*(0.88 + u_fold*0.36)*k;
    aur += gcol*gB;
    cover += gB;
  }

  // sparse stars, kept clear of the horizon and of the curtain
  vec2 gp = vec2(x, hv)*60.0;
  vec2 cell = floor(gp);
  float hct = hash21(cell);
  float starI = 0.0;
  if (hct > 0.96) {
    vec2 spos = vec2(hash21(cell + 11.3), hash21(cell + 27.7))*0.6 + 0.2;
    float r = length(fract(gp) - spos);
    float tw = 0.6 + 0.4*sin(u_t*(2.0 + hct*6.0) + hct*100.0);
    float bmag = (hct - 0.96)/0.04;
    starI = pow(max(0.0, 1.0 - r/0.14), 4.0)*(0.3 + 0.7*bmag)*tw;
    starI *= smoothstep(0.03, 0.12, hv)*clamp(1.0 - cover*2.2, 0.0, 1.0);
    float skyL = dot(sky, vec3(0.299, 0.587, 0.114));
    starI *= 1.0 - smoothstep(0.25, 0.6, skyL);
  }

  vec3 col = clamp(sky + aur*u_gain + vec3(0.95, 0.97, 1.0)*starI*0.6, 0.0, 1.0);
  gl_FragColor = vec4(col, 1.0);
}`;

  /* Night swim stops from the FeralUI Aurora gradient studio (lightest rim through
     darkest sky). This is the exported colour order, not a restyle. */
  const TONES = {
    deep: [0.0863, 0.1333, 0.3020],     // MIDNIGHT LAPIS #16224D
    horizon: [0.1804, 0.4314, 0.5020],  // DEEP HANADA #2E6E80
    glow: [0.2941, 0.9098, 0.6275],     // CLEAR BAMBOO #4BE8A0
    rim: [0.9176, 1.0000, 0.9569]       // MINTED BAMBOO #EAFFF4
  };

  const FLOW = { freq: 1.12, fold: 0.52, drift: 0.32, dir: 0, lift: 0.0, gain: 1.0 };

  const SKY = {
    canvas: null, gl: null, prog: null, buf: null,
    u: null, ro: null, vp: null, raf: 0, last: 0, t0: 0,
    dpr: 1, w: 0, h: 0, failed: false, running: false, paused: false
  };

  const MAX_DPR = 1.6;
  const MAX_PIXELS = 2_400_000;
  const FRAME_MS = 1000 / 30;

  function compile(gl, kind, src) {
    const sh = gl.createShader(kind);
    if (!sh) return null;
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      console.warn('[aurora] shader compile failed:', gl.getShaderInfoLog(sh));
      gl.deleteShader(sh);
      return null;
    }
    return sh;
  }

  function init() {
    if (SKY.gl || SKY.failed) return !!SKY.gl;
    const canvas = SKY.canvas || document.createElement('canvas');
    canvas.id = 'aurora';
    canvas.setAttribute('aria-hidden', 'true');
    const gl = canvas.getContext('webgl', { alpha: false, antialias: false, depth: false, stencil: false, powerPreference: 'low-power' })
      || canvas.getContext('experimental-webgl', { alpha: false, antialias: false });
    if (!gl) { SKY.failed = true; return false; }

    const vs = compile(gl, gl.VERTEX_SHADER, VS);
    const fs = compile(gl, gl.FRAGMENT_SHADER, FS);
    if (!vs || !fs) { SKY.failed = true; return false; }

    const prog = gl.createProgram();
    gl.attachShader(prog, vs);
    gl.attachShader(prog, fs);
    gl.bindAttribLocation(prog, 0, 'p');
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
      console.warn('[aurora] link failed:', gl.getProgramInfoLog(prog));
      SKY.failed = true;
      return false;
    }
    gl.useProgram(prog);

    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

    const loc = (n) => gl.getUniformLocation(prog, n);
    const u = {
      res: loc('u_res'), t: loc('u_t'),
      deep: loc('u_deep'), horizon: loc('u_horizon'), glow: loc('u_glow'), rim: loc('u_rim'),
      drift: loc('u_drift'), fold: loc('u_fold'), freq: loc('u_freq'), dirv: loc('u_dirv'),
      lift: loc('u_lift'), gain: loc('u_gain')
    };

    gl.uniform3f(u.deep, TONES.deep[0], TONES.deep[1], TONES.deep[2]);
    gl.uniform3f(u.horizon, TONES.horizon[0], TONES.horizon[1], TONES.horizon[2]);
    gl.uniform3f(u.glow, TONES.glow[0], TONES.glow[1], TONES.glow[2]);
    gl.uniform3f(u.rim, TONES.rim[0], TONES.rim[1], TONES.rim[2]);
    gl.uniform1f(u.freq, FLOW.freq);
    gl.uniform1f(u.fold, FLOW.fold);
    gl.uniform1f(u.drift, FLOW.drift);
    gl.uniform1f(u.lift, FLOW.lift);
    gl.uniform1f(u.gain, FLOW.gain);
    const ang = (FLOW.dir % 4) * (Math.PI / 2);
    gl.uniform2f(u.dirv, Math.cos(ang), Math.sin(ang));

    if (!canvas.dataset.auroraCtx) {
      canvas.dataset.auroraCtx = '1';
      canvas.addEventListener('webglcontextlost', (e) => {
        e.preventDefault();
        stop();
        SKY.gl = null;
        SKY.prog = null;
        SKY.failed = false;
      });
      canvas.addEventListener('webglcontextrestored', () => {
        SKY.gl = null;
        SKY.prog = null;
        SKY.failed = false;
        if (init()) start();
      });
    }

    SKY.canvas = canvas;
    SKY.gl = gl;
    SKY.prog = prog;
    SKY.buf = buf;
    SKY.u = u;
    SKY.t0 = performance.now();
    return true;
  }

  function measure() {
    const vp = SKY.vp;
    if (!vp) return;
    const cw = Math.max(1, vp.clientWidth);
    const ch = Math.max(1, vp.clientHeight);

    let dpr = Math.min(window.devicePixelRatio || 1, MAX_DPR);
    const px = cw * ch * dpr * dpr;
    if (px > MAX_PIXELS) dpr *= Math.sqrt(MAX_PIXELS / px);

    const w = Math.max(1, Math.round(cw * dpr));
    const h = Math.max(1, Math.round(ch * dpr));
    if (w === SKY.w && h === SKY.h) return;
    SKY.w = w;
    SKY.h = h;
    SKY.dpr = dpr;
    SKY.canvas.width = w;
    SKY.canvas.height = h;
    SKY.canvas.style.width = '100%';
    SKY.canvas.style.height = '100%';
  }

  function draw(now) {
    if (!SKY.gl || !SKY.w) return;
    const gl = SKY.gl;
    gl.viewport(0, 0, SKY.w, SKY.h);
    gl.uniform2f(SKY.u.res, SKY.w, SKY.h);
    gl.uniform1f(SKY.u.t, (now - SKY.t0) / 1000);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  function loop(now) {
    if (!SKY.running || SKY.paused) { SKY.raf = 0; return; }
    SKY.raf = requestAnimationFrame(loop);
    if (document.hidden) return;
    if (now - SKY.last < FRAME_MS) return;
    SKY.last = now;
    draw(now);
  }

  function bind(vp) {
    if (!vp) return;
    if (SKY.vp !== vp) {
      if (SKY.ro) { SKY.ro.disconnect(); SKY.ro = null; }
      SKY.vp = vp;
      if (window.ResizeObserver) {
        SKY.ro = new ResizeObserver(() => {
          measure();
          if (!SKY.running) draw(performance.now());
        });
        SKY.ro.observe(vp);
      }
    }
    if (SKY.canvas && SKY.canvas.parentElement !== vp) {
      vp.insertBefore(SKY.canvas, vp.firstChild);
      SKY.w = 0;
      SKY.h = 0;
    }
  }

  function start() {
    if (!init()) return;
    const vp = document.getElementById('cv-vp');
    if (!vp) return;
    bind(vp);
    if (SKY.canvas.parentElement !== vp) vp.insertBefore(SKY.canvas, vp.firstChild);
    SKY.canvas.style.display = 'block';
    measure();
    draw(performance.now());
    SKY.paused = false;      // an explicit start always means "run"
    SKY.running = true;
    if (!SKY.raf) SKY.raf = requestAnimationFrame(loop);
  }

  function stop() {
    SKY.running = false;
    if (SKY.raf) cancelAnimationFrame(SKY.raf);
    SKY.raf = 0;
  }

  function setPaused(paused) {
    SKY.paused = !!paused;
    if (SKY.paused) {
      stop();
      if (SKY.gl) draw(performance.now());
      return;
    }
    start();
  }

  function available() {
    return !SKY.failed;
  }

  window.SmywAurora = { start, stop, setPaused, available, bind, _state: SKY };
})();

<script>
/* smyw review workbench: shell behaviour.
 *
 * Owns the three-column frame: rail and inspector toggles, the compact header with
 * a secondary-action menu, one canvas control cluster, and the shared view store.
 * The aurora renderer is separate (aurora.js); this file only starts and pauses it.
 */
(function () {
  'use strict';

  const KEY = 'smyw:shell:v1';
  const DEFAULTS = {
    railOpen: { changed: true, unchanged: false },
    cmp: 'both',
    fold: {},
    dimPages: true,
    motion: null,
    fit: 'read',
    railPanel: true,
    dtPanel: true,
    display: false
  };

  const ST = (() => {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { saved = null; }
    const s = Object.assign({}, DEFAULTS, saved || {});
    s.railOpen = Object.assign({}, DEFAULTS.railOpen, (saved && saved.railOpen) || {});
    s.fold = Object.assign({}, (saved && saved.fold) || {});
    if (s.fit !== 'card' && s.fit !== 'read') s.fit = 'read';
    return s;
  })();

  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify(ST)); } catch (e) { /* storage blocked */ }
  }

  let applying = false;
  const ready = () => !!(window.smyw && window.smyw.state && window.smyw.units);
  const narrow = () => window.innerWidth <= 1040;

  function changedPages() {
    const set = new Set();
    window.smyw.units.forEach((u) => set.add(u.page));
    return set;
  }

  function flowChanged(f) {
    if (f.change && f.change !== 'unchanged') return true;
    return (f.steps || []).some((s) => s.change && s.change !== 'unchanged');
  }

  // ================================================================ aurora adapter
  const reduceQuery = (() => {
    try { return window.matchMedia('(prefers-reduced-motion: reduce)'); } catch (e) { return null; }
  })();

  const prefersReduced = () => !!(reduceQuery && reduceQuery.matches);

  function motionWanted() {
    if (prefersReduced()) return false;
    if (ST.motion === null) return true;
    return !!ST.motion;
  }

  function syncAurora() {
    const api = window.SmywAurora;
    if (!api) return;
    const vp = document.getElementById('cv-vp');
    if (vp) api.bind(vp);
    if (motionWanted() && api.available()) api.start();
    else api.setPaused(true);
  }

  // ================================================================ header
  function headerMeta() {
    const sp = window.smyw.state.spec;
    const units = window.smyw.units;
    const pages = changedPages();
    const flows = sp.flows.filter(flowChanged).length;
    const mods = (sp.backend || []).filter((m) => (m.change && m.change !== 'unchanged') ||
      (m.items || []).some((i) => i.change && i.change !== 'unchanged')).length;
    return { units: units.length, pages: pages.size, pageTotal: sp.pages.length, flows, flowTotal: sp.flows.length, mods, modTotal: (sp.backend || []).length };
  }

  function buildHeaderMenu(top, extra) {
    let wrap = top.querySelector('.hdr-more');
    if (wrap) return wrap;
    wrap = document.createElement('div');
    wrap.className = 'hdr-more';
    const trigger = document.createElement('button');
    trigger.type = 'button';
    trigger.textContent = '\u66F4\u591A';
    trigger.setAttribute('aria-haspopup', 'menu');
    trigger.setAttribute('aria-expanded', 'false');
    wrap.append(trigger);

    trigger.addEventListener('click', (e) => {
      e.stopPropagation();
      const menu = wrap.querySelector('.hdr-menu');
      if (menu) { menu.remove(); trigger.setAttribute('aria-expanded', 'false'); return; }
      const m = document.createElement('div');
      m.className = 'hdr-menu';
      m.setAttribute('role', 'menu');

      const add = (label, hint, action, cls) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.setAttribute('role', 'menuitem');
        b.append(document.createTextNode(label));
        if (hint) {
          const k = document.createElement('span');
          k.className = 'k';
          k.textContent = hint;
          b.append(k);
        }
        if (cls) b.className = cls;
        b.addEventListener('click', () => { m.remove(); trigger.setAttribute('aria-expanded', 'false'); action(); });
        m.append(b);
        return b;
      };

      const undo = extra.undo;
      const redo = extra.redo;
      const u = add('\u64A4\u9500', 'Ctrl+Z', () => window.smyw.undo());
      const r = add('\u91CD\u505A', 'Ctrl+Shift+Z', () => window.smyw.redo());
      if (!undo) u.disabled = true;
      if (!redo) r.disabled = true;

      const sep = document.createElement('div');
      sep.className = 'sep';
      m.append(sep);

      add('\u5BFC\u51FA\u7ED3\u6784\u5FEB\u7167', 'JSON', () => {
        try {
          const blob = new Blob([JSON.stringify(window.smyw.exportJSON ? window.smyw.exportJSON() : {}, null, 2)], { type: 'application/json' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'smyw-spec.json';
          a.click();
          setTimeout(() => URL.revokeObjectURL(a.href), 4000);
        } catch (err) { console.warn(err); }
      });
      add('\u56DE\u5230\u9876\u90E8', 'Home', () => {
        const main = document.getElementById('main');
        if (main) main.scrollTo({ top: 0, behavior: 'smooth' });
      });

      const liveReset = [...document.querySelectorAll('.acts-top > button')].find((x) =>
        /\u91CD\u7F6E|\u518D\u70B9\u4E00\u6B21/.test(x.textContent || ''));
      const confirm = !!(liveReset && /\u518D\u70B9\u4E00\u6B21/.test(liveReset.textContent || ''));
      const rb = add(confirm ? '\u518D\u70B9\u4E00\u6B21\u786E\u8BA4\u91CD\u7F6E' : '\u91CD\u7F6E', '', () => {
        if (liveReset) liveReset.click();
      }, confirm ? 'danger' : '');
      if (!liveReset) rb.disabled = true;

      wrap.append(m);
      trigger.setAttribute('aria-expanded', 'true');
      document.addEventListener('click', function once() {
        m.remove();
        trigger.setAttribute('aria-expanded', 'false');
        document.removeEventListener('click', once);
      });
    });

    const acts = top.querySelector('.acts-top');
    if (acts) acts.append(wrap); else top.append(wrap);
    return wrap;
  }

  function enhanceHeader() {
    const top = document.querySelector('.top');
    if (!top) return;
    const h1 = top.querySelector('h1');
    if (h1 && !h1.title) h1.title = h1.textContent.trim();

    const m = headerMeta();
    let meta = top.querySelector('.hdr-meta');
    if (!meta) {
      meta = document.createElement('span');
      meta.className = 'hdr-meta';
      const anchor = top.querySelector('.stage') || top.querySelector('.ver') || h1;
      if (anchor && anchor.parentNode) anchor.after(meta); else top.append(meta);
    }
    const text = '\u6539\u52A8 ' + m.units + ' \u00B7 \u9875\u9762 ' + m.pages + '/' + m.pageTotal +
      ' \u00B7 \u6D41\u7A0B ' + m.flows + '/' + m.flowTotal +
      ' \u00B7 \u540E\u7AEF ' + m.mods + '/' + m.modTotal;
    if (meta.textContent !== text) meta.textContent = text;

    // The runtime's 演示 / mode / undo / redo / feedback / reset all sit in .acts-top.
    // Keep 演示, the mode switch and 反馈 as primary; move the rest into the menu.
    const acts = top.querySelector('.acts-top');
    if (!acts) return;

    const buttons = Array.from(acts.querySelectorAll(':scope > button'));
    const findBy = (re) => buttons.find((b) => re.test(b.textContent));

    const play = findBy(/\u6F14\u793A|\u9000\u51FA\u6F14\u793A/);
    const undoB = findBy(/^\u21B6|\u64A4\u9500/);
    const redoB = findBy(/^\u21B7|\u91CD\u505A/);
    const resetB = findBy(/\u91CD\u7F6E/);
    const fbB = findBy(/\u53CD\u9988/);

    // Undo/redo/reset leave the visible bar; keep the original nodes so their
    // click handlers (including reset's two-click confirm) stay intact.
    if (undoB) undoB.style.display = 'none';
    if (redoB) redoB.style.display = 'none';
    if (resetB) resetB.style.display = 'none';

    if (fbB) fbB.classList.add('primary');
    if (play) play.classList.add('play-btn');

    buildHeaderMenu(top, {
      undo: undoB ? !undoB.disabled : false,
      redo: redoB ? !redoB.disabled : false,
      reset: !!resetB,
      resetConfirm: !!(resetB && /\u518D\u70B9\u4E00\u6B21/.test(resetB.textContent || ''))
    });

    // Keep the menu's enabled state honest after every redraw.
    const menuWrap = top.querySelector('.hdr-more');
    if (menuWrap) {
      menuWrap.dataset.hasUndo = undoB && !undoB.disabled ? '1' : '';
      menuWrap.dataset.hasRedo = redoB && !redoB.disabled ? '1' : '';
    }
  }

  // ================================================================ tabs
  function enhanceTabs() {
    const tabs = document.querySelector('.tabs');
    if (!tabs) return;
    tabs.setAttribute('role', 'tablist');
    tabs.querySelectorAll('button').forEach((b) => {
      b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', b.classList.contains('on') ? 'true' : 'false');
    });
  }

  // ================================================================ rail
  function groupShell(label) {
    const d = document.createElement('details');
    d.className = 'rail-g';
    const s = document.createElement('summary');
    s.append(document.createTextNode(label));
    const n = document.createElement('span');
    n.className = 'rail-g-n';
    s.append(n);
    const b = document.createElement('div');
    b.className = 'rail-g-b';
    d.append(s, b);
    return { root: d, body: b, count: n };
  }

  function enhanceRail() {
    const list = document.querySelector('.cv-list');
    if (!list) return;
    if (list.querySelector('.rail-g')) {
      list.querySelectorAll('.rail-g').forEach((g) => {
        const label = g.querySelector('summary').firstChild.textContent;
        const key = /\u672C\u6B21/.test(label) ? 'changed' : 'unchanged';
        if (g.open !== ST.railOpen[key]) g.open = ST.railOpen[key];
      });
      return;
    }

    const sp = window.smyw.state.spec;
    const pages = changedPages();
    const pageBtns = Array.from(list.querySelectorAll(':scope > .cv-page'));
    if (!pageBtns.length || pageBtns.length !== sp.pages.length) return;

    const bucket = { changed: [], unchanged: [] };
    let cur = 'unchanged';
    let idx = -1;
    const count = { changed: 0, unchanged: 0 };

    Array.from(list.children).forEach((el) => {
      if (el.classList.contains('cv-page')) {
        idx += 1;
        const p = sp.pages[idx];
        const isChanged = pages.has(p.id) || (p.change && p.change !== 'unchanged');
        cur = isChanged ? 'changed' : 'unchanged';
        if (isChanged) el.classList.add('rail-key');
        count[cur] += 1;
        bucket[cur].push(el);
      } else if (el.classList.contains('cv-item')) {
        bucket[cur].push(el);
      } else if (el.classList.contains('hint')) {
        el.remove();
      }
    });

    if (!bucket.changed.length) return;

    const gC = groupShell('\u672C\u6B21\u53D8\u66F4');
    const gU = groupShell('\u672A\u6539\u9875\u9762');
    gC.count.textContent = String(count.changed);
    gU.count.textContent = String(count.unchanged);
    gC.body.append(...bucket.changed);
    gU.body.append(...bucket.unchanged);

    const secT = list.querySelector(':scope > .sec-t');
    if (secT) {
      secT.textContent = '\u76EE\u5F55';
      secT.after(gC.root, gU.root);
    } else {
      pageBtns[0].before(gC.root, gU.root);
    }

    [['changed', gC.root], ['unchanged', gU.root]].forEach(([k, root]) => {
      root.open = ST.railOpen[k];
      root.querySelector('summary').addEventListener('click', () => {
        requestAnimationFrame(() => { ST.railOpen[k] = root.open; persist(); });
      });
    });
  }

  function syncPanels() {
    const layout = document.querySelector('.cv-layout');
    if (!layout) return;
    const isNarrow = narrow();

    const leftover = layout.querySelector('.insp-empty');
    if (leftover) leftover.remove();
    const hasInspector = !!layout.querySelector('.inspector.dt');

    if (isNarrow) {
      // Rails are overlays here: state names differ from the desktop collapse flags.
      layout.classList.toggle('rail-open', !!ST.railOpenMobile);
      layout.classList.toggle('dt-open', !!ST.dtOpenMobile && hasInspector);
      layout.classList.remove('rail-off', 'dt-off');
    } else {
      layout.classList.remove('rail-open', 'dt-open');
      layout.classList.toggle('rail-off', !ST.railPanel);
      layout.classList.toggle('dt-off', !ST.dtPanel || !hasInspector);
    }

    // Backdrop for the mobile drawers
    let back = layout.querySelector('.drawer-back');
    if (isNarrow && (ST.railOpenMobile || ST.dtOpenMobile)) {
      if (!back) {
        back = document.createElement('button');
        back.type = 'button';
        back.className = 'drawer-back';
        back.setAttribute('aria-label', '\u5173\u95ED\u4FA7\u680F');
        back.addEventListener('click', () => {
          ST.railOpenMobile = false;
          ST.dtOpenMobile = false;
          syncPanels();
        });
        layout.insertBefore(back, layout.firstChild);
      }
    } else if (back) {
      back.remove();
    }

    const l = document.querySelector('.pane-toggle.l');
    const r = document.querySelector('.pane-toggle.r');
    if (l) l.setAttribute('aria-expanded', String(isNarrow ? !!ST.railOpenMobile : !!ST.railPanel));
    if (r) r.setAttribute('aria-expanded', String(isNarrow ? !!ST.dtOpenMobile : !!ST.dtPanel));
  }

  // ================================================================ canvas controls
  function enhanceTools() {
    const vp = document.getElementById('cv-vp');
    const tools = document.querySelector('.cv-tools');
    if (!vp || !tools) return;

    // Pane toggles on the canvas edges, so the rails are discoverable after collapsing.
    if (!vp.querySelector('.pane-toggle.l')) {
      const l = document.createElement('button');
      l.type = 'button';
      l.className = 'pane-toggle l';
      l.textContent = '\u2630 \u76EE\u5F55';
      l.title = '\u663E\u793A\u6216\u9690\u85CF\u5DE6\u4FA7\u76EE\u5F55';
      l.addEventListener('click', () => {
        if (narrow()) ST.railOpenMobile = !ST.railOpenMobile;
        else ST.railPanel = !ST.railPanel;
        persist();
        syncPanels();
        queueReveal('keep');
      });
      vp.append(l);

      const r = document.createElement('button');
      r.type = 'button';
      r.className = 'pane-toggle r';
      r.textContent = '\u68C0\u67E5\u5668 \u203A';
      r.title = '\u663E\u793A\u6216\u9690\u85CF\u53F3\u4FA7\u68C0\u67E5\u5668';
      r.addEventListener('click', () => {
        if (narrow()) ST.dtOpenMobile = !ST.dtOpenMobile;
        else ST.dtPanel = !ST.dtPanel;
        persist();
        syncPanels();
        queueReveal('keep');
      });
      vp.append(r);
    }

    // Zoom cluster: zoom out / readout / zoom in / fit-current, then fit mode, then display.
    if (!tools.querySelector('[data-t="reframe"]')) {
      const b = document.createElement('button');
      b.type = 'button';
      b.dataset.t = 'reframe';
      b.textContent = '\u9002\u914D\u5F53\u524D';
      b.title = '\u6309\u5F53\u524D\u6A21\u5F0F\u91CD\u65B0\u53D6\u666F\uFF1B\u4E0D\u6539\u52A8\u9009\u4E2D\u4E0E\u6279\u6CE8';
      b.addEventListener('click', () => { if (currentPageId()) framePage(currentPageId(), ST.fit); });
      tools.append(b);
    }

    if (!tools.querySelector('.cv-fitseg')) {
      const seg = document.createElement('span');
      seg.className = 'cv-fitseg';
      seg.setAttribute('role', 'group');
      seg.setAttribute('aria-label', '\u53D6\u666F\u6A21\u5F0F');
      [['read', '\u9605\u8BFB\u5C3A\u5BF8', '\u6309 100% \u663E\u793A\uFF0C\u5B57\u53EF\u8BFB\uFF0C\u62D6\u52A8\u5E73\u79FB\u770B\u5168'],
       ['card', '\u6574\u5361\u9002\u914D', '\u6574\u5F20\u5361\u7247\u5B8C\u6574\u653E\u8FDB\u89C6\u91CE\u3002\u603B\u89C8\u7528\uFF0C\u4E0D\u7528\u6765\u8BFB\u5B57']
      ].forEach(([mode, label, tip]) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.dataset.pan = 'fit';
        b.dataset.fit = mode;
        b.textContent = label;
        b.title = tip;
        b.addEventListener('click', () => setFit(mode));
        seg.append(b);
      });
      tools.append(seg);
      syncFitButtons();
    }

    // Display switches collapse into one popover: they are view preferences, not actions.
    if (!tools.querySelector('[data-t="disp"]')) {
      const sep = document.createElement('span');
      sep.className = 'cv-sep';
      tools.append(sep);

      const b = document.createElement('button');
      b.type = 'button';
      b.dataset.t = 'disp';
      b.textContent = '\u663E\u793A';
      b.title = '\u53D8\u66F4\u6807\u8BB0\u3001\u6DE1\u5316\u3001\u8FDE\u7EBF\u7B49\u67E5\u770B\u5F00\u5173';
      b.setAttribute('aria-expanded', 'false');
      b.addEventListener('click', (e) => {
        e.stopPropagation();
        ST.display = !ST.display;
        renderDisplayPop(sep.parentElement);
      });
      tools.append(b);
    }

    // Motion toggle stays visible: it is the one control a reader reaches for.
    if (!tools.querySelector('[data-t="motion"]')) {
      const sep2 = document.createElement('span');
      sep2.className = 'cv-sep';
      tools.append(sep2);
      const b = document.createElement('button');
      b.type = 'button';
      b.dataset.t = 'motion';
      b.textContent = '\u6781\u5149';
      b.title = '\u80CC\u666F\u6781\u5149\u662F\u5426\u6D41\u52A8';
      b.addEventListener('click', () => {
        ST.motion = !motionWanted();
        persist();
        syncMotionButton();
        syncAurora();
      });
      tools.append(b);
      syncMotionButton();
    }

    // The runtime's own display buttons become the popover contents.
    const legacy = Array.from(tools.querySelectorAll(':scope > button')).filter((x) =>
      /^[^\u9002\u663E\u6781]/.test(x.textContent) &&
      !x.dataset.t &&
      !x.closest('.cv-fitseg'));
    legacy.forEach((x) => { x.dataset.legacy = '1'; x.style.display = 'none'; });
    tools.querySelectorAll(':scope > button').forEach((b) => {
      if (b.title && b.title.indexOf('\u6574\u4E2A\u753B\u5E03') >= 0) b.style.display = 'none';
    });

    renderDisplayPop(tools);
  }

  function renderDisplayPop(tools) {
    const host = document.querySelector('.cv-tools [data-t="disp"]');
    if (!host) return;
    let pop = host.querySelector('.cv-disp');
    if (!ST.display) {
      if (pop) pop.remove();
      host.setAttribute('aria-expanded', 'false');
      return;
    }
    if (!pop) {
      pop = document.createElement('div');
      pop.className = 'cv-disp';
      host.append(pop);
      const close = (e) => {
        if (pop.contains(e.target) || host.contains(e.target)) return;
        ST.display = false;
        renderDisplayPop(tools);
        document.removeEventListener('click', close);
      };
      setTimeout(() => document.addEventListener('click', close), 0);
    }
    pop.replaceChildren();

    const items = [];
    const links = document.querySelector('.cv-tools button[title*="\u8FDE\u7EBF"]');
    const fnB = Array.from(document.querySelectorAll('.cv-tools > button')).find((b) => /\u51FD\u6570/.test(b.textContent));
    const compB = Array.from(document.querySelectorAll('.cv-tools > button')).find((b) => /\u7EC4\u4EF6/.test(b.textContent));
    const fadeB = Array.from(document.querySelectorAll('.cv-tools > button')).find((b) => /\u6DE1\u5316/.test(b.textContent));
    if (links) items.push(['\u5168\u90E8\u8FDE\u7EBF', links]);
    if (fnB) items.push(['\u51FD\u6570\u5360\u4F4D', fnB]);
    if (compB) items.push(['\u7EC4\u4EF6\u540D', compB]);
    if (fadeB) items.push(['\u6DE1\u5316\u672A\u6539\u5143\u7D20', fadeB]);

    items.forEach(([label, src]) => {
      const b = document.createElement('button');
      b.type = 'button';
      const on = src.classList.contains('on');
      b.classList.toggle('on', on);
      b.append(document.createTextNode(label));
      const st = document.createElement('span');
      st.className = 'st';
      st.textContent = on ? '\u5F00' : '\u5173';
      b.append(st);
      b.addEventListener('click', (e) => {
        e.stopPropagation();
        src.click();
        setTimeout(() => renderDisplayPop(tools), 40);
      });
      pop.append(b);
    });

    // Whole-page dimming is ours, not the runtime's.
    const dim = document.createElement('button');
    dim.type = 'button';
    dim.classList.toggle('on', ST.dimPages);
    dim.append(document.createTextNode('\u5F31\u5316\u672A\u6539\u9875\u9762'));
    const ds = document.createElement('span');
    ds.className = 'st';
    ds.textContent = ST.dimPages ? '\u5F00' : '\u5173';
    dim.append(ds);
    dim.addEventListener('click', (e) => {
      e.stopPropagation();
      ST.dimPages = !ST.dimPages;
      persist();
      enhanceFrames();
      renderDisplayPop(tools);
    });
    pop.append(dim);
  }

  function syncFitButtons() {
    document.querySelectorAll('.cv-tools [data-pan="fit"]').forEach((b) => {
      const on = b.dataset.fit === ST.fit;
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', String(on));
    });
  }

  function setFit(mode) {
    ST.fit = mode;
    persist();
    syncFitButtons();
    const pid = currentPageId();
    if (pid) framePage(pid, mode);
  }

  function syncMotionButton() {
    const b = document.querySelector('.cv-tools [data-t="motion"]');
    if (!b) return;
    const on = motionWanted();
    const unavailable = window.SmywAurora && !window.SmywAurora.available();
    b.textContent = unavailable ? '\u6781\u5149 \u00B7 \u4E0D\u53EF\u7528' : ('\u6781\u5149 ' + (on ? '\u5F00' : '\u5173'));
    b.classList.toggle('on', on && !unavailable);
    b.setAttribute('aria-pressed', String(on));
    b.disabled = !!unavailable;
    b.title = unavailable
      ? '\u672C\u673A\u6D4F\u89C8\u5668\u672A\u63D0\u4F9B WebGL\uFF0C\u5DF2\u4F7F\u7528\u9759\u6001\u80CC\u666F'
      : (prefersReduced()
        ? '\u7CFB\u7EDF\u5DF2\u5F00\u542F\u300C\u51CF\u5C11\u52A8\u753B\u300D\uFF0C\u9ED8\u8BA4\u9759\u6001'
        : '\u80CC\u666F\u6781\u5149\u662F\u5426\u6D41\u52A8');
  }

  // ================================================================ framing
  const PAD = 40;
  const TOOLS = 56;
  const READ_SCALE = 1;
  const MAX_SCALE = 1.35;

  function worldBox(el) {
    const world = document.getElementById('cv-world');
    if (!el || !world) return null;
    const k = (window.smyw.ui.cam && window.smyw.ui.cam.k) || 1;
    const wr = world.getBoundingClientRect();
    const er = el.getBoundingClientRect();
    if (wr.width > 1 && er.width > 1) {
      return {
        x: (er.left - wr.left) / k,
        y: (er.top - wr.top) / k,
        w: er.width / k,
        h: er.height / k
      };
    }
    let x = 0, y = 0, n = el;
    while (n && n !== world) {
      x += n.offsetLeft;
      y += n.offsetTop;
      n = n.offsetParent;
    }
    return { x: x, y: y, w: el.offsetWidth, h: el.offsetHeight };
  }

  function writeCam(cam) {
    window.smyw.ui.cam = cam;
    const world = document.getElementById('cv-world');
    if (world) world.style.transform = 'translate(' + cam.x + 'px,' + cam.y + 'px) scale(' + cam.k + ')';
    const z = document.getElementById('cv-zoom');
    if (z) z.textContent = Math.round(cam.k * 100) + '%';
  }

  function panTo(k, box, vp) {
    const vw = vp.clientWidth, vh = vp.clientHeight;
    const tw = box.w * k, th = box.h * k;
    const x = tw <= vw - PAD ? (vw - tw) / 2 - box.x * k : PAD - box.x * k;
    const y = th <= vh - PAD - TOOLS ? Math.max(PAD, (vh - TOOLS - th) / 2) - box.y * k : PAD - box.y * k;
    writeCam({ k: k, x: x, y: y });
  }

  function currentPageId() {
    const ui = window.smyw.ui;
    if (ui.page) return ui.page;
    if (ui.sel && ui.sel.page) return ui.sel.page;
    const first = window.smyw.units[0];
    return first ? first.page : null;
  }

  function pageFrame(pid) {
    if (!pid) return null;
    return document.querySelector('#cv-world .cv-frame[data-page="' + CSS.escape(pid) + '"]');
  }

  function targetEl() {
    const ui = window.smyw.ui;
    if (ui.unit) {
      const node = document.querySelector('#cv-world [data-kind="node"][data-id="' + CSS.escape(ui.unit) + '"]:not(.wf-slot)');
      if (node) return node;
      const asPage = pageFrame(ui.unit);
      if (asPage) return asPage;
    }
    if (ui.sel && ui.sel.kind === 'node' && ui.sel.id) {
      const n = document.querySelector('#cv-world [data-kind="node"][data-id="' + CSS.escape(ui.sel.id) + '"]:not(.wf-slot)');
      if (n) return n;
    }
    return pageFrame(currentPageId());
  }

  function framePage(pageId, mode) {
    const vp = document.getElementById('cv-vp');
    const el = pageFrame(pageId);
    if (!vp || !el) return false;
    const box = worldBox(el);
    if (!box || !box.w || !vp.clientWidth) return false;
    const m = mode || ST.fit;
    const availW = Math.max(120, vp.clientWidth - PAD * 2);
    const availH = Math.max(120, vp.clientHeight - PAD * 2 - TOOLS);
    if (m === 'card') {
      panTo(Math.max(0.12, Math.min(MAX_SCALE, availW / box.w, availH / box.h)), box, vp);
    } else {
      panTo(READ_SCALE, box, vp);
    }
    return true;
  }

  function revealTarget(opts) {
    const vp = document.getElementById('cv-vp');
    const el = targetEl();
    if (!vp || !el) return false;
    const box = worldBox(el);
    if (!box || !box.w) return false;
    let k = (window.smyw.ui.cam && window.smyw.ui.cam.k) || READ_SCALE;
    const keep = !!(opts && opts.keepScale);
    if (ST.fit === 'read' || !keep) {
      k = Math.max(READ_SCALE, Math.min(MAX_SCALE, k));
    }
    panTo(k, box, vp);
    return true;
  }

  let revealTok = 0;
  let revealKind = null;
  function queueReveal(kind) {
    if (kind === 'keep' && revealKind && revealKind !== 'keep') return;
    const n = ++revealTok;
    revealKind = kind;
    let hops = 0;
    const hop = () => {
      if (n !== revealTok) return;
      hops += 1;
      if (hops < 3) { requestAnimationFrame(hop); return; }
      revealKind = null;
      if (kind === 'keep') revealTarget({ keepScale: true });
      else if (kind === 'sel') revealTarget({ keepScale: false });
      else framePage(currentPageId(), ST.fit);
      syncAurora();
    };
    requestAnimationFrame(hop);
  }

  let lastHasInsp = null;
  function noteInspector() {
    const has = !!document.querySelector('.cv-layout .inspector.dt');
    const changed = lastHasInsp !== null && lastHasInsp !== has;
    lastHasInsp = has;
    if (changed) queueReveal('keep');
  }

  // ================================================================ canvas scopes
  function enhanceFrames() {
    const pages = changedPages();
    const sp = window.smyw.state.spec;
    document.querySelectorAll('#cv-world .cv-frame[data-page]').forEach((fr) => {
      const p = sp.pages.find((x) => x.id === fr.dataset.page);
      const isChanged = pages.has(fr.dataset.page) || (p && p.change && p.change !== 'unchanged');
      fr.classList.toggle('is-unchanged', !isChanged);
    });
    const world = document.getElementById('cv-world');
    if (world) world.classList.toggle('dim-pages', ST.dimPages);
  }

  // ================================================================ comparison
  const CMP = { both: '\u524D\u540E\u5BF9\u7167', before: '\u53EA\u770B\u6539\u52A8\u524D', after: '\u53EA\u770B\u6539\u52A8\u540E' };

  function cmpBar() {
    const bar = document.createElement('div');
    bar.className = 'cmp-bar';
    const lab = document.createElement('span');
    lab.className = 'cmp-lab';
    lab.textContent = '\u5BF9\u7167';
    bar.append(lab);
    const seg = document.createElement('div');
    seg.className = 'cmp-seg';
    seg.setAttribute('role', 'group');
    seg.setAttribute('aria-label', '\u5BF9\u7167\u89C6\u56FE');
    ['both', 'before', 'after'].forEach((k) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = CMP[k];
      b.dataset.cmp = k;
      b.setAttribute('aria-pressed', String(ST.cmp === k));
      b.addEventListener('click', () => { ST.cmp = k; persist(); syncCmp(); });
      seg.append(b);
    });
    bar.append(seg);
    return bar;
  }

  function syncCmp() {
    document.querySelectorAll('.dt-cmp,.flows .compare,.be .compare').forEach((c) => {
      c.dataset.cmp = ST.cmp;
      const prev = c.previousElementSibling;
      const bar = prev && prev.classList && prev.classList.contains('cmp-bar') ? prev : null;
      if (!bar) c.parentNode.insertBefore(cmpBar(), c);
      else bar.querySelectorAll('.cmp-seg button').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.cmp === ST.cmp)));
    });
  }

  // ================================================================ flows
  function enhanceFlows() {
    const sp = window.smyw.state.spec;
    document.querySelectorAll('.flows .flow').forEach((flowEl) => {
      const head = flowEl.querySelector('.flow-head');
      if (!head) return;
      const f = sp.flows.find((x) => x.id === head.dataset.id);
      if (!f) return;

      const byId = new Map(f.steps.map((s) => [s.id, s]));
      flowEl.querySelectorAll('.lanes').forEach((lanes) => {
        const numByRow = new Map();
        lanes.querySelectorAll('.step-n').forEach((n) => numByRow.set(n.style.gridRow, n));
        lanes.querySelectorAll('.step[data-id]').forEach((el) => {
          const step = byId.get(el.dataset.id);
          const isSame = step && (!step.change || step.change === 'unchanged');
          el.classList.toggle('step-same', !!isSame);
          const num = numByRow.get(el.style.gridRow);
          if (num) num.classList.toggle('step-same', !!isSame);
        });
      });

      const changed = f.steps.filter((s) => s.change && s.change !== 'unchanged').length;
      const total = f.steps.length;
      flowEl.classList.toggle('only-chg', !!ST.fold[f.id]);
      flowEl.classList.toggle('has-chg', changed > 0);

      if (!head.querySelector('.flow-fold')) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'flow-fold';
        b.textContent = '\u53EA\u770B\u53D8\u5316\u6B65\u9AA4 ' + changed + '/' + total;
        b.disabled = changed === 0 || changed === total;
        b.setAttribute('aria-pressed', String(!!ST.fold[f.id]));
        b.title = changed === 0
          ? '\u672C\u6D41\u7A0B\u6CA1\u6709\u6B65\u9AA4\u7EA7\u53D8\u5316\uFF0C\u4FDD\u7559\u5B8C\u6574\u524D\u540E\u6D41\u7A0B'
          : '\u9690\u85CF\u6CA1\u6709\u53D8\u5316\u7684\u6B65\u9AA4\uFF1B\u6267\u884C\u987A\u5E8F\u3001\u6B65\u9AA4\u7F16\u53F7\u548C\u524D\u540E\u5BF9\u5E94\u5173\u7CFB\u4FDD\u6301\u4E0D\u53D8';
        b.addEventListener('click', () => {
          ST.fold[f.id] = !ST.fold[f.id];
          persist();
          flowEl.classList.toggle('only-chg', !!ST.fold[f.id]);
          b.setAttribute('aria-pressed', String(!!ST.fold[f.id]));
          const note = flowEl.querySelector('.flow-note');
          if (note) note.hidden = !ST.fold[f.id];
        });
        head.append(b);
      } else {
        head.querySelector('.flow-fold').setAttribute('aria-pressed', String(!!ST.fold[f.id]));
      }

      let tag = head.querySelector('.flow-unchanged');
      if (!tag) {
        tag = document.createElement('span');
        tag.className = 'flow-unchanged';
        tag.textContent = '\u65E0\u6B65\u9AA4\u53D8\u5316';
        head.append(tag);
      }
      tag.hidden = changed > 0;

      if (!flowEl.querySelector('.flow-note')) {
        const note = document.createElement('div');
        note.className = 'flow-note';
        note.textContent = '\u5DF2\u9690\u85CF ' + (total - changed) + ' \u4E2A\u672A\u53D8\u5316\u6B65\u9AA4\uFF1B\u6B65\u9AA4\u7F16\u53F7\u4FDD\u7559\uFF0C\u5BF9\u5E94\u5173\u7CFB\u4E0D\u53D8\u3002';
        note.hidden = !ST.fold[f.id];
        const cmp = flowEl.querySelector('.compare');
        if (cmp) cmp.after(note);
      }
    });
  }

  // ================================================================ inline mono tokens
  const TOKEN_RE = new RegExp([
    '`[^`]+`',
    '(?:python3?|dotnet|node|pip|tensorboard)\\s+[^\\s\uFF0C\u3002\uFF1B\u3001,;]+',
    '\\b[A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.-]+)+',
    '--[a-z][a-z0-9-]*',
    '\\b[A-Za-z0-9_]+\\.(?:py|zip|json|md|tsv|npz|html|css|js)\\b',
    '\\b(?:Box|Discrete)\\(\\d+\\)',
    '\\b[A-Za-z_][A-Za-z0-9_]*\\(\\)',
    '\\b[A-Z][A-Za-z0-9]+(?:Mismatch|Pin)\\b'
  ].join('|'), 'g');

  const TEXT_HOSTS = '.wf-text,.wf-sub,.wf-it,.step-t,.be-note,.dt-list li,.ctext,.mod-note,.ins-note,.wf-note,.wf-same';

  function monoPass(root) {
    (root.querySelectorAll ? root.querySelectorAll(TEXT_HOSTS) : []).forEach((host) => {
      if (host.dataset.mono === '1') return;
      if (host.closest('button, input, select, textarea, code')) return;
      host.dataset.mono = '1';
      const walker = document.createTreeWalker(host, NodeFilter.SHOW_TEXT);
      const targets = [];
      let node;
      while ((node = walker.nextNode())) {
        if (node.parentElement && node.parentElement.closest('code')) continue;
        if (TOKEN_RE.test(node.nodeValue)) targets.push(node);
        TOKEN_RE.lastIndex = 0;
      }
      targets.forEach((tn) => {
        const text = tn.nodeValue;
        const frag = document.createDocumentFragment();
        let last = 0, m;
        TOKEN_RE.lastIndex = 0;
        while ((m = TOKEN_RE.exec(text)) !== null) {
          if (m.index > last) frag.append(document.createTextNode(text.slice(last, m.index)));
          const code = document.createElement('code');
          code.className = 'ic';
          const raw = m[0];
          code.textContent = raw.startsWith('`') && raw.endsWith('`') && raw.length > 2 ? raw.slice(1, -1) : raw;
          frag.append(code);
          last = m.index + raw.length;
        }
        if (last < text.length) frag.append(document.createTextNode(text.slice(last)));
        tn.parentNode.replaceChild(frag, tn);
      });
    });
  }

  // ================================================================ first paint
  let framedOnce = false;
  let lastTab = null;

  /* The grid settles one frame after the rails and inspector exist, so framing has to
     wait for a measured viewport instead of running on the first patch. */
  let framing = false;
  function frameWhenReady(pid, attempt) {
    const n = attempt || 0;
    const vp = document.getElementById('cv-vp');
    if (!vp || !pid) { framing = false; return; }
    if (vp.clientWidth < 40 || vp.clientHeight < 40) {
      if (n < 90) requestAnimationFrame(() => frameWhenReady(pid, n + 1));
      else framing = false;
      return;
    }
    const el = document.querySelector('#cv-world .cv-frame[data-page="' + CSS.escape(pid) + '"]');
    if (!el || el.offsetWidth < 40) {
      if (n < 90) requestAnimationFrame(() => frameWhenReady(pid, n + 1));
      else framing = false;
      return;
    }
    framePage(pid, ST.fit);
    const a = el.getBoundingClientRect();
    const b = vp.getBoundingClientRect();
    const ix = Math.max(0, Math.min(a.right, b.right) - Math.max(a.left, b.left));
    const iy = Math.max(0, Math.min(a.bottom, b.bottom) - Math.max(a.top, b.top));
    if (ix * iy >= 80000) { framedOnce = true; framing = false; return; }
    if (n < 90) requestAnimationFrame(() => frameWhenReady(pid, n + 1));
    else framing = false;
  }

  function initialFrame() {
    if (framedOnce || framing) return;
    if (window.smyw.ui.tab !== 'canvas') return;
    const pid = currentPageId();
    if (!pid) return;
    framing = true;
    requestAnimationFrame(() => requestAnimationFrame(() => frameWhenReady(pid, 0)));
  }

  function reframeOnTabReturn() {
    const tab = window.smyw.ui.tab;
    const cameBack = lastTab !== null && lastTab !== tab && tab === 'canvas';
    lastTab = tab;
    if (!cameBack) return;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      const pid = currentPageId();
      if (pid) frameWhenReady(pid, 0);
    }));
  }

  let lastMode = null;
  function reframeOnMode() {
    const mode = window.smyw.ui && window.smyw.ui.mode;
    const changed = lastMode !== null && lastMode !== mode;
    lastMode = mode;
    if (!changed) return;
    const world = document.getElementById('cv-world');
    const cam = window.smyw.ui.cam;
    if (cam && world && !world.style.transform) writeCam(cam);
    queueReveal('keep');
  }

  // ================================================================ driver
  function enhance() {
    if (!ready()) return;
    enhanceHeader();
    enhanceTabs();
    enhanceRail();
    enhanceFrames();
    enhanceTools();
    syncPanels();
    noteInspector();
    syncCmp();
    enhanceFlows();
    monoPass(document.getElementById('app') || document.body);
    initialFrame();
    reframeOnTabReturn();
    reframeOnMode();
    syncAurora();
  }

  let lastWidth = window.innerWidth;

  function run() {
    if (applying) return;
    applying = true;
    try { enhance(); } catch (e) { console.error('workbench shell:', e); } finally { applying = false; }
  }

  function installFocusGuard() {
    const api = window.smyw;
    if (!api || api._shellCam) return;
    api._shellCam = true;
    const origUnit = api.focusUnit;
    const origNode = api.focusNode;
    api.focusUnit = function (key, opts) {
      origUnit.call(this, key, Object.assign({}, opts || {}, { zoom: false }));
      queueReveal('sel');
    };
    api.focusNode = function (pid, id) {
      origNode.call(this, pid, id);
      queueReveal('sel');
    };
    document.addEventListener('click', (e) => {
      if (e.target.closest && e.target.closest('.cv-item[data-u], .cv-page')) queueReveal('sel');
    }, true);
  }

  function start() {
    run();
    installFocusGuard();

    const app = document.getElementById('app');
    if (app) {
      let queued = false;
      new MutationObserver(() => {
        if (queued) return;
        queued = true;
        requestAnimationFrame(() => { queued = false; run(); });
      }).observe(app, { childList: true, subtree: true });
    }

    const vp0 = document.getElementById('cv-vp');
    if (vp0 && window.ResizeObserver && !vp0._shellRo) {
      vp0._shellRo = new ResizeObserver(() => {
        queueReveal('keep');
        syncAurora();
      });
      vp0._shellRo.observe(vp0);
    }

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) syncAurora();
    });

    window.addEventListener('resize', () => {
      const cross = (lastWidth > 1040) !== (window.innerWidth > 1040);
      lastWidth = window.innerWidth;
      if (cross) {
        ST.railOpenMobile = false;
        ST.dtOpenMobile = false;
        syncPanels();
      }
      syncAurora();
      queueReveal('keep');
    });

    try {
      if (reduceQuery && reduceQuery.addEventListener) {
        reduceQuery.addEventListener('change', () => {
          syncMotionButton();
          syncAurora();
        });
      }
    } catch (e) { /* older engines */ }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();

</script>
