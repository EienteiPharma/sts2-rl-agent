[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sts2-rl-agent"
version = "0.1.0"
description = "Slay the Spire 2 headless combat simulator for RL training"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=1.0.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
train = [
    "stable-baselines3>=2.3.0",
    "sb3-contrib>=2.3.0",
    "torch>=2.0",
    "tensorboard>=2.21.0",
    "tqdm>=4.70.1",
    "rich>=15.0.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
colab = [
    "onnx>=1.23.0",
    "onnxruntime>=1.30.0",
    "pyarrow>=25.0.1",
]

[tool.setuptools.packages.find]
include = ["sts2_env*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
